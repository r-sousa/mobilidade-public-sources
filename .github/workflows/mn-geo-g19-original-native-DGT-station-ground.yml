name: MN-GEO-RAIL-001 G19 original DGT 2m native ground coverage to 54 hypothetical research sites
on:
  push:
    branches:
      - mn-geo-rail-001-g19-site-native-ground-gates-20261031
      - main
    paths:
      - tools/geo_rail_g19_native_DGT_station_ground_gates.py
      - tests/test_geo_rail_g19_native_site_ground.py
      - .github/workflows/mn-geo-g19-original-native-DGT-station-ground.yml
permissions:
  contents: write
jobs:
  native_DGT_2m_ground_actual_site_source_coverage_gates:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install specialist real geometry coordinate tools
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Verify source geometry coverage is not inferred from merely catalogue bbox
        shell: bash
        run: |
          python -m py_compile tools/geo_rail_g19_native_DGT_station_ground_gates.py
          python -m unittest discover -s tests -p test_geo_rail_g19_native_site_ground.py -v
      - name: Retrieve only archived G16 research sites and G18 hypothetical stop patterns, SHA-pin original evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G19-original"
          gh release download mn-geo-rail-001-g16-bgra-station-pareto-pop-road-terrain-41252022610 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G16-54-source-research-point-city-population-access-terrain.json' --dir "$RUNNER_TEMP/G19-original"
          gh release download mn-geo-rail-001-g18-four-service-stop-patterns-original-INE-41253766127 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G18-three-families-four-stop-patterns-15-30-45min-2021-residents.json' --dir "$RUNNER_TEMP/G19-original"
          echo "e794c14b2d9101a7d6d31dd11f46081039e6dba40349b0e32018b57eeb79c7a9  $RUNNER_TEMP/G19-original/G16-54-source-research-point-city-population-access-terrain.json" | sha256sum -c -
          echo "6c9db058f0cd07966daf5afb5ec8fa8dbd411eb47409a24f6b83f8712b48f0f2  $RUNNER_TEMP/G19-original/G18-three-families-four-stop-patterns-15-30-45min-2021-residents.json" | sha256sum -c -
      - name: Intersect real source original DGT 2m footprint QA not STAC metadata against 54 studied sites
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g19_native_DGT_station_ground_gates.py \
            --g16 "$RUNNER_TEMP/G19-original/G16-54-source-research-point-city-population-access-terrain.json" \
            --g18 "$RUNNER_TEMP/G19-original/G18-three-families-four-stop-patterns-15-30-45min-2021-residents.json" \
            --b1 reports/mn-geo-rail-001/B1-DGT-native-2m-32km2-verified-ground-sector-review.json \
            --grid12 reports/mn-geo-rail-001/pt-dgt-native-grid12-preserved-audit.json \
            --native279503 reports/mn-geo-rail-001/pt-dgt-native-279503-NP159-source-qa-acceptance.json \
            --json "$RUNNER_TEMP/G19-54-native-DGT-2m-research-site-coverage-and-priority.json" \
            --markdown "$RUNNER_TEMP/G19-stations-original-ground-gaps-and-stop-service.md" \
            --geojson "$RUNNER_TEMP/G19-54-source-points-native-DGT-verified-ground-status.geojson"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((p/"G19-54-native-DGT-2m-research-site-coverage-and-priority.json").read_text())
          assert r["original_native_DGT_2m_ground_verified_disconnected_area_km2"]==45
          assert r["all_research_source_points"]==54
          assert len(r["18_markets_by_family_source_native_ground_coverage_priority"])==18
          assert len(r["12_service_pattern_2021_30min_road_coverage_cross_reference"])==12
          assert r["native_original_ground_coverage_is_NOT_full_corridor_coverage"]
          assert r["selected_station_locations_approved_or_even_engineered"]==0
          assert r["mandatory_urban_markets"]==["Vila Real","Bragança"] and r["Sanabria_excluded"]
          assert r["no_fabricated_EUR_tunnel_bridge_or_station_counts"]
          assert r["no_repeated_DGT_downloads"] and not r["Fxx_accepted"] and not r["Site_authorized"]
          print("G19 source-only QA real 45km2 original DGT + 54 existing research sites + 18 service markets, no fabricated feasibility")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G19-native-original-DGT-versus-54-station-studies
          path: |
            ${{ runner.temp }}/G19-54-native-DGT-2m-research-site-coverage-and-priority.json
            ${{ runner.temp }}/G19-stations-original-ground-gaps-and-stop-service.md
            ${{ runner.temp }}/G19-54-source-points-native-DGT-verified-ground-status.geojson
          retention-days: 30
          if-no-files-found: error
      - name: Preserve original verified 2m ground physical site preacceptance results on main only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g19-native-ground-site-feasibility-audit-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$RUNNER_TEMP/G19-54-native-DGT-2m-research-site-coverage-and-priority.json" \
            "$RUNNER_TEMP/G19-stations-original-ground-gaps-and-stop-service.md" \
            "$RUNNER_TEMP/G19-54-source-points-native-DGT-verified-ground-status.geojson" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G19 54 research station positions actual certified original DGT2m ground coverage + service evidence gates" \
            --notes "Source proven 45km2 original DGT2m disconnected: B1 8 city blocks (32km2) plus 12km2 contiguous and 1km2 isolated Mirandela, no false catalogue footprints/DSM treated as original pixels. For each of 54 G16 corridor/market/offset research positions, actual contained ground, 1km-square surrounding ground fraction, nearest real QA footprint, G16 road/DSM/2021 geographic population and prior G18 30min hypothetical train stop service population, with all station costs, curvature, lawful interfaces unknown. No new DGT acquisition and no Fxx/Site. Vila Real+Braganca compulsory, Sanabria excluded."

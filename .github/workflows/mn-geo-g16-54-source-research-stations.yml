name: MN-GEO-RAIL-001 G16 54 actual INE census/road/DSM station research reference screens
on:
  push:
    branches:
      - mn-geo-rail-001-g16-station-site-portfolio-20261031
      - main
    paths:
      - tools/geo_rail_g16_station_research_pareto.py
      - tests/test_geo_rail_g16_station_research_pareto.py
      - .github/workflows/mn-geo-g16-54-source-research-stations.yml
permissions:
  contents: write
jobs:
  G16_three_territorial_families_nondominated_station_study_points:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified INE census reader and geometry
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Test source consumer exact import and multi-objective Pareto without invented weights
        run: |
          python -m py_compile tools/geo_rail_g16_station_research_pareto.py
          python -m unittest discover -s tests -p 'test_geo_rail_g16_station_research_pareto.py' -v
      - name: Retrieve previously verified first-party INE original and G13A archived input, SHA pinned
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G16-source"
          gh release download mn-f67-bgri21-cont-original-INE-verified-20261031 \
            --repo "$GITHUB_REPOSITORY" --pattern BGRI21_CONT.zip --dir "$RUNNER_TEMP/G16-source"
          gh release download mn-geo-rail-001-g13a-local-surface-access-41248977225 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern G13A-108-station-research-site-surface-graded-access.json \
            --dir "$RUNNER_TEMP/G16-source"
          echo "3eb49fb9e262e9d6ccb4b493811b7e21e2bbb31b0afe1431851ddd459ad7f171  $RUNNER_TEMP/G16-source/BGRI21_CONT.zip" | sha256sum -c -
          echo "063c1ddae2eb8020edc530bfef09fe8239208068b918a56d6054005ad31bfaee  $RUNNER_TEMP/G16-source/G13A-108-station-research-site-surface-graded-access.json" | sha256sum -c -
      - name: 54 source study points 5 and 10km real INE population and no arbitrary weighted Pareto
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g16_station_research_pareto.py \
            --zip "$RUNNER_TEMP/G16-source/BGRI21_CONT.zip" \
            --g13a "$RUNNER_TEMP/G16-source/G13A-108-station-research-site-surface-graded-access.json" \
            --json "$RUNNER_TEMP/G16-54-source-research-point-city-population-access-terrain.json" \
            --markdown "$RUNNER_TEMP/G16-three-corridor-family-six-city-station-study-portfolio.md"
          python - <<'PY'
          import os,pathlib,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          d=json.loads((p/"G16-54-source-research-point-city-population-access-terrain.json").read_text())
          assert d["source_sites_screened"]==54
          assert len(d["market_by_family_pareto_reference_screen"])==18
          assert len(d["all_54_source_research_station_reference_alternatives"])==54
          assert d["two_mandatory_cities"]==["Vila Real","Bragança"]
          assert d["public_transport_coverage_at_NUTS2_Norte_unavailable_for_systematic_comparison"]
          assert d["no_PT_data_is_not_no_actual_PT_service_and_no_PT_score_imposed"]
          assert d["station_engineering_and_capex_unknown"]
          assert d["GPKG_original_native_QA"]["record_count"]==203264
          assert not d["Fxx_accepted"] and not d["Site_authorized"]
          assert all(x["nondominated_reference_positions"] in (1,2,3) for x in d["market_by_family_pareto_reference_screen"])
          print("G16 verified: 54 INE-origin 2021 census population / OSRM road snap / DSM terrain study point comparisons, 18 non-dominated city corridor sets. NOT stations.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G16-three-corridors-54-study-station-pareto
          path: |
            ${{ runner.temp }}/G16-54-source-research-point-city-population-access-terrain.json
            ${{ runner.temp }}/G16-three-corridor-family-six-city-station-study-portfolio.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish G16 source research after main source QA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g16-bgra-station-pareto-pop-road-terrain-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/G16-54-source-research-point-city-population-access-terrain.json" "$RUNNER_TEMP/G16-three-corridor-family-six-city-station-study-portfolio.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G16 54 original-INE 2021 BGRI census, G13A DSM terrain and road reference study-station Pareto screens" \
            --notes "Three original geographic corridors P1-2-1/P2-2-1/P2-2-3 x six markets (Vila Real/Bragança mandatory, Guimarães/Amarante/Mirandela/Macedo optional) x three source geometry positions. Non-dominated research refs based on 5km BGRI21 2021 residents, 2026 OSRM car time to road near research track grid (NOT stations), 30m surface DSM local 18/25permille pressure proxy. No constructed station, verified land legal access, true terrain cut/fill or cost EUR, OD rail demand or reliable Norte NUTS II bus/PT timetable data. Missing PT never scores zero; research circle != travel-time catchment. No new INE acquisitions, Fxx, Site."

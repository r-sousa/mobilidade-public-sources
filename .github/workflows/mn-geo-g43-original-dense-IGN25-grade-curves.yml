name: MN-GEO-RAIL-001 G43 true original 25m dense terrain and vertical curve engineering sensitivity
on:
  push:
    branches:
      - mn-geo-rail-001-g43-real-dense-25m-grade-curvature-20261101
      - main
    paths:
      - tools/geo_rail_g43_original_IGN_dense_25m_vertical_curvature.py
      - tests/test_geo_rail_g43_true_dense_terrain.py
      - .github/workflows/mn-geo-g43-original-dense-IGN25-grade-curves.yml
permissions:
  contents: read
jobs:
  branch-reuse-G39-13-original-TIFFs-25m-full-real-source:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g43-real-dense-25m-grade-curvature-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original rasterio source geometry scipy grade LP and matplotlib
        run: python -m pip install --disable-pip-version-check 'scipy>=1.12,<2' 'numpy>=1.26,<3' 'shapely>=2.1,<3' 'rasterio>=1.4,<2' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: G43 25m dense source authenticity and LP vertical radius maths tests
        run: |
          python -m py_compile tools/geo_rail_g43_original_IGN_dense_25m_vertical_curvature.py
          python -m unittest discover -s tests -p 'test_geo_rail_g43_true_dense_terrain.py' -v
      - name: Reuse previous G39 13 original IGN MDT25 source TIFF and G42 30-mode grade results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G43"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' --dir "$RUNNER_TEMP/G43"
          gh release download mn-geo-rail-001-g39-real-6km-IGN-MDT25-41306354452 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G39-6km-Zamora-13-original-ground-samples-with-source-QA.json' \
            --pattern 'G39-13-original-IGN-MDT25-WCS-TIFF-tiles.zip' --dir "$RUNNER_TEMP/G43"
          gh release download mn-geo-rail-001-g42-real-railgrade-limits-all30-41320331517 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json' \
            --dir "$RUNNER_TEMP/G43"
          echo "77d226cc842d33e2f799f2c269ddde57a17cb7d868791770c1624dda1b86136d  $RUNNER_TEMP/G43/G10-27-research-real-source-paths.geojson" | sha256sum -c -
      - name: Actual source GeoTIFF 25m every 25m, 13 original SHA, 18/25 per mille curvature radius sensitivities
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g43_original_IGN_dense_25m_vertical_curvature.py \
            --g10 "$RUNNER_TEMP/G43/G10-27-research-real-source-paths.geojson" \
            --g39 "$RUNNER_TEMP/G43/G39-6km-Zamora-13-original-ground-samples-with-source-QA.json" \
            --g42 "$RUNNER_TEMP/G43/G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json" \
            --originalzip "$RUNNER_TEMP/G43/G39-13-original-IGN-MDT25-WCS-TIFF-tiles.zip" \
            --json "$RUNNER_TEMP/G43/G43-6km-G39-reused-originals-241-25m-source-grade-curve.json" \
            --csv "$RUNNER_TEMP/G43/G43-Zamora-6km-original-MDT25-bareearth-25m-series.csv" \
            --markdown "$RUNNER_TEMP/G43/G43-dense-original-G39-ground-railgrade-curve-sensitivity.md" \
            --plot "$RUNNER_TEMP/G43/G43-real-IGN25-ground-vs-18-25permille-10km-curve.png"
          python - <<'PY'
          import pathlib,os,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G43"
          d=json.loads((p/"G43-6km-G39-reused-originals-241-25m-source-grade-curve.json").read_text())
          assert d["source_all30_preserved_previous_G42"]
          assert d["original_IGN_source_1km_TIFF_reused"]==13
          assert d["G43_original_25m_ground_sampling_n"]==241
          assert d["G43_original_dense_ground_valid_n"]+d["G43_original_dense_ground_missing_n"]==241
          assert len(d["optimistic_grade_vertical_curvature_LP_sensitivity"])==12
          assert d["new_original_data_downloaded"] is False
          assert d["no_rail_structure_lengths_EUR_costs_or_operational_train_times"]
          assert d["Natura2000_and_PIC_are_not_cleared"] and not d["Fxx_accepted"] and not d["Site_authorized"]
          assert (p/"G43-real-IGN25-ground-vs-18-25permille-10km-curve.png").stat().st_size>20000
          print("G43 original TIFF 25m dense real data:",d["G43_original_dense_ground_valid_n"],"/241; biggest continuous",d["contiguous_original_dense_source_segment_length_m"],"metres")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G43-dense-original-IGN25-source-vertical-curve
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G43/G43-6km-G39-reused-originals-241-25m-source-grade-curve.json
            ${{ runner.temp }}/G43/G43-Zamora-6km-original-MDT25-bareearth-25m-series.csv
            ${{ runner.temp }}/G43/G43-dense-original-G39-ground-railgrade-curve-sensitivity.md
            ${{ runner.temp }}/G43/G43-real-IGN25-ground-vs-18-25permille-10km-curve.png
  main-publish-G43-verified-original-source:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact same tested source producer and actual original source reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g43-original-dense-IGN25-grade-curves.yml"
          b="mn-geo-rail-001-g43-real-dense-25m-grade-curvature-20261101"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$id" && test "$id" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')"
          f="tools/geo_rail_g43_original_IGN_dense_25m_vertical_curvature.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$sha" --jq '.sha')" = "$(git hash-object "$f")"
          mkdir -p "$RUNNER_TEMP/G43-pub"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G43-dense-original-IGN25-source-vertical-curve \
            --dir "$RUNNER_TEMP/G43-pub"
          python - <<'PY'
          import pathlib,os,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G43-pub"
          d=json.loads((p/"G43-6km-G39-reused-originals-241-25m-source-grade-curve.json").read_text())
          assert d["source_all30_preserved_previous_G42"] and d["original_IGN_source_1km_TIFF_reused"]==13
          assert d["G43_original_25m_ground_sampling_n"]==241 and len(d["optimistic_grade_vertical_curvature_LP_sensitivity"])==12
          assert d["Natura2000_and_PIC_are_not_cleared"] and not d["Fxx_accepted"] and not d["Site_authorized"]
          PY
      - name: Publish existing original TIFF source reused in genuine first dense 25m gradient/vertical radius envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G43-pub"
          gh release create "mn-geo-rail-001-g43-dense-25m-railgrade-curve-$GITHUB_RUN_ID" \
            "$d/G43-6km-G39-reused-originals-241-25m-source-grade-curve.json" \
            "$d/G43-Zamora-6km-original-MDT25-bareearth-25m-series.csv" \
            "$d/G43-dense-original-G39-ground-railgrade-curve-sensitivity.md" \
            "$d/G43-real-IGN25-ground-vs-18-25permille-10km-curve.png" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G43 real 25m ground dense 6km profile and rail research 18/25 permille vertical radius tests" \
            --notes "Reuses only G39 prior original 13 IGN/CNIG WCS 1km MDT25 original TIFFs with all individual original SHA tests. Samples source 25m pixels every 25m along research grid 6km (up to 241), no imputed missing. Mathematically minimizes vertical envelope with 18/25permille grades and exploratory 10km/20km vertical curve radius sensitivity, free vs source-ground fixed endpoints. Horizontal grid lacks railway curves/engineering and studies don't estimate structures, costs, times, environmental permit or transnational vertical datum; full G10 27+G30 3 retained, historic DGT stations untouched, no new original DGT or IGN acquisition, no Fxx/Site."

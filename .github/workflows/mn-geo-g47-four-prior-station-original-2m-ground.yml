name: MN-GEO-RAIL-001 G47 original DGT2m pixels four station 3km existing source GIS profiles
on:
  push:
    branches:
      - mn-geo-rail-001-g47-native2m-4station-pilot-20261101
      - main
    paths:
      - tools/geo_rail_g47_original_DGT2m_station_3km_ground.py
      - tests/test_geo_rail_g47_original_native_source.py
      - .github/workflows/mn-geo-g47-four-prior-station-original-2m-ground.yml
permissions:
  contents: read
jobs:
  branch-reuse-public-18-original-native-DGT-raster-3km:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g47-native2m-4station-pilot-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original georeferenced DGT native 2m pixel and scipy terrain grade libraries
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4' 'rasterio>=1.4,<2' 'matplotlib>=3.8,<4'
      - name: Five fail closed tests G47 previous 18/18 original pixel tiles and GitHub public source asset authenticity
        run: |
          python -m py_compile tools/geo_rail_g47_original_DGT2m_station_3km_ground.py
          python -m unittest discover -s tests -p 'test_geo_rail_g47_original_native_source.py' -v
      - name: Retrieve only previous G45 G46 public evidence and public GitHub original native DGT raster index (no DGT secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G47/raw"
          gh release download mn-geo-rail-001-g45-movable-city-railapproach-41332951589 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G45-30-all-630-original-station-2D-spline-approach-screen.json' \
            --dir "$RUNNER_TEMP/G47"
          gh release download mn-geo-rail-001-g46-DGT84-vs-630-station-splines-41333603439 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G46-630-source-alternatives-original-DGT2m-terrain-coverage.json' \
            --dir "$RUNNER_TEMP/G47"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/G47/G47-GitHub-source-public-releases-index-temporary.json"
      - name: Reuse ONLY 18 public original GeoTIFF source assets (G21 G3 B1), index SHA spatial source; no DGT private credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g47_original_DGT2m_station_3km_ground.py \
            --mode retrieve \
            --g45 "$RUNNER_TEMP/G47/G45-30-all-630-original-station-2D-spline-approach-screen.json" \
            --g46 "$RUNNER_TEMP/G47/G46-630-source-alternatives-original-DGT2m-terrain-coverage.json" \
            --releases "$RUNNER_TEMP/G47/G47-GitHub-source-public-releases-index-temporary.json" \
            --rawdir "$RUNNER_TEMP/G47/raw" \
            --receipts "$RUNNER_TEMP/G47/G47-reused-18-original-DGT2m-TIFF-source-SHA-receipts.json"
      - name: Native ORIGINAL 2m ground sampling 4 sites x121 pixels at 25m, real 18/25 permille LP with zero-imputed-NoData prohibited
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g47_original_DGT2m_station_3km_ground.py \
            --mode analyze \
            --g45 "$RUNNER_TEMP/G47/G45-30-all-630-original-station-2D-spline-approach-screen.json" \
            --g46 "$RUNNER_TEMP/G47/G46-630-source-alternatives-original-DGT2m-terrain-coverage.json" \
            --rawdir "$RUNNER_TEMP/G47/raw" \
            --receipts "$RUNNER_TEMP/G47/G47-reused-18-original-DGT2m-TIFF-source-SHA-receipts.json" \
            --json "$RUNNER_TEMP/G47/G47-native-original-DGT2m-four-station-study-3km-ground-and-grade.json" \
            --csv "$RUNNER_TEMP/G47/G47-four-station-3km-25m-actual-original-DGT2m-ground.csv" \
            --markdown "$RUNNER_TEMP/G47/G47-four-old-station-approaches-first-real-DGT2m-ground-grade-analysis.md" \
            --plot "$RUNNER_TEMP/G47/G47-four-old-station-original-DGT2m-3km-ground-profiles.png"
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G47"
          d=json.loads((p/"G47-native-original-DGT2m-four-station-study-3km-ground-and-grade.json").read_text())
          assert d["all_30_G10_27_G30_3_retained"] and d["G45_all630_options_still_in_canonical_previous_evidence"]
          assert d["reused_existing_original_DGT_2m_GitHub_public_tile_assets_count"]==18
          assert len(d["four_real_original_source_native_ground_station_3km_profiles"])==4
          assert len(d["real_4x121_25m_sample_original_native_DGT2m_pixel_rows"])==484
          assert d["no_new_DGT_credentialed_source_acquisition"] and d["all_invalid_pixels_kept_missing_not_imputed"]
          assert d["no_real_railway_structure_tunnel_viaduct_or_cost_timetable"]
          assert d["no_Natura_PIC_water_legal_geotechnics_or_road_station_entrance_approved"]
          assert not d["Fxx_accepted"] and not d["Site_authorized"]
          assert (p/"G47-four-old-station-original-DGT2m-3km-ground-profiles.png").stat().st_size>20000
          print("G47 authentic original DGT 2m source native pixels 484 observations all NoData preserved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G47-18-original-DGT2m-4-station-3km-native-ground
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G47/G47-native-original-DGT2m-four-station-study-3km-ground-and-grade.json
            ${{ runner.temp }}/G47/G47-four-station-3km-25m-actual-original-DGT2m-ground.csv
            ${{ runner.temp }}/G47/G47-four-old-station-approaches-first-real-DGT2m-ground-grade-analysis.md
            ${{ runner.temp }}/G47/G47-four-old-station-original-DGT2m-3km-ground-profiles.png
  main-G47-verified-source-unchanged-publication:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact original tested G47 producer and 18 original raster SHA receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g47-four-prior-station-original-2m-ground.yml"
          b="mn-geo-rail-001-g47-native2m-4station-pilot-20261101"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$id" && test "$id" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')"
          file="tools/geo_rail_g47_original_DGT2m_station_3km_ground.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$sha" --jq '.sha')" = "$(git hash-object "$file")"
          mkdir -p "$RUNNER_TEMP/G47-pub"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G47-18-original-DGT2m-4-station-3km-native-ground \
            --dir "$RUNNER_TEMP/G47-pub"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G47-pub"
          d=json.loads((p/"G47-native-original-DGT2m-four-station-study-3km-ground-and-grade.json").read_text())
          assert d["all_30_G10_27_G30_3_retained"]
          assert d["reused_existing_original_DGT_2m_GitHub_public_tile_assets_count"]==18
          assert len(d["real_4x121_25m_sample_original_native_DGT2m_pixel_rows"])==484
          assert d["all_invalid_pixels_kept_missing_not_imputed"] and d["no_new_DGT_credentialed_source_acquisition"]
          assert not d["Fxx_accepted"] and not d["Site_authorized"]
          PY
      - name: Publish SOURCE native true pixel profiles only, no 18 redundant large original DGT tif copies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G47-pub"
          gh release create "mn-geo-rail-001-g47-4-DGT-native2m-original-profiles-$GITHUB_RUN_ID" \
            "$d/G47-native-original-DGT2m-four-station-study-3km-ground-and-grade.json" \
            "$d/G47-four-station-3km-25m-actual-original-DGT2m-ground.csv" \
            "$d/G47-four-old-station-approaches-first-real-DGT2m-ground-grade-analysis.md" \
            "$d/G47-four-old-station-original-DGT2m-3km-ground-profiles.png" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G47 first TRUE original Portuguese DGT 2m ground profiles along VR2 VR1 BR4 BR3 station approach segments" \
            --notes "Preserves G45/G46 all 30 scenarios and 7 previous station sites; focuses four prior DGT2m physical study locations VR2 VR1 BR4 BR3, 200km/h planimetric reference P2-2-1 3km long centered at each previous station. Original DGT 2m native 1km source GeoTIFFs are fetched from prior public GH releases, not DGT account, native EPSG:3763 and 2m 500x500 pixel bbox and SHA validated; sample 121 real source pixels per site, 25m sample spacing, null NoData preserved, optimistic 18/25 per mille mathematical grade LP where full ground source continuous. NO actual 3D horizontal rail construction/clothoids, real station, earthwork/tunnel/viaduct amounts or EUR CAPEX or train time, Natura/PIC/legal approval or new DGT protected credential access. No duplicate 18 raw TIFF released. No Fxx/Site."

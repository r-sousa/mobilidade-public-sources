name: MN-GEO-RAIL-001 W3 preserve small exact Spanish CNIG WCS TIFF responses
on:
  push:
    branches:
      - mn-geo-rail-001-w3-cnig-wcs-preservation-20261031
    paths:
      - tools/geo_rail_es_wcs_preserve_response.py
      - tests/test_geo_rail_es_wcs_preserve_response.py
      - .github/workflows/mn-geo-w3-cnig-wcs-preserve.yml
permissions:
  contents: read
concurrency:
  group: mn-geo-rail-001-w3-cnig-source-preservation
  cancel-in-progress: false
jobs:
  source-original-response-QA:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-w3-cnig-wcs-preservation-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official TIFF processing requirements
        run: python -m pip install 'rasterio>=1.3,<2' 'numpy>=1.24,<3'
      - name: Offline bounded WCS source-response gate tests
        run: python -m unittest discover -s tests -p 'test_geo_rail_es_wcs_preserve_response.py' -v
      - name: Acquire exactly two 1-km2 WCS GeoTIFF responses without authentication
        run: |
          set -euo pipefail
          python tools/geo_rail_es_wcs_preserve_response.py --acquire "$RUNNER_TEMP/cnig-wcs-approved"
          python tools/geo_rail_es_wcs_preserve_response.py --verify-existing "$RUNNER_TEMP/cnig-wcs-approved"
      - name: Retain exact two TIFF responses and sanitized QA for independent publishing
        uses: actions/upload-artifact@v4
        with:
          name: mn-geo-rail-001-w3-cnig-1km2-real-WCS-${{ github.run_id }}
          path: ${{ runner.temp }}/cnig-wcs-approved/
          if-no-files-found: error
          retention-days: 7
  publish-licensed-WCS-without-registered-credentials:
    needs: source-original-response-QA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rasterio>=1.3,<2' 'numpy>=1.24,<3'
      - uses: actions/download-artifact@v4
        with:
          name: mn-geo-rail-001-w3-cnig-1km2-real-WCS-${{ github.run_id }}
          path: ${{ runner.temp }}/cnig-wcs-approved
      - name: Reopen BOTH source responses and independently verify SHA, shape, CRS, mask and extent
        run: |
          python tools/geo_rail_es_wcs_preserve_response.py --verify-existing "$RUNNER_TEMP/cnig-wcs-approved"
      - name: Publish new immutable CC BY 4.0 prerelease for direct public WCS responses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-cnig-wcs-zamora-1km2-preacceptance-${GITHUB_RUN_ID}"
          d="$RUNNER_TEMP/cnig-wcs-approved"
          cat > "$RUNNER_TEMP/notes.txt" <<'EOF'
          Source: Instituto Geografico Nacional (IGN) / Centro Nacional de Informacion Geografica (CNIG), Spain.
          Licence: Creative Commons Attribution 4.0 International (CC BY 4.0) with IGN/CNIG attribution.
          Public WCS service: https://servicios.idee.es/wcs-inspire/mdt
          Licence evidence: https://datos.gob.es/es/catalogo/e0dat0002-wcs-de-modelos-digitales-del-terreno-de-espana1

          These are the byte-identical actual public WCS GetCoverage response TIFFs, NOT the producer's original classified LiDAR / national MDT source files.
          Both resolutions overlap the SAME 1km2 sample in Zamora, EPSG:25830, not 2km2 and not a continuous rail corridor.
          PREACCEPTANCE ONLY. No independent Spanish native vertical datum validation or PT-ES geodetic harmonization, rail engineering, Fxx or Site.
          No registered DGT credentials, private signed URLs or account cookies.
          EOF
          gh release create "$tag" "$d/cnig-zamora-WCS-response-5m.tif" "$d/cnig-zamora-WCS-response-25m.tif" "$d/cnig-zamora-WCS-source-QA.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "MN-GEO-RAIL-001 CNIG WCS Zamora 1km2 (5m+25m) PREACCEPTANCE" --notes-file "$RUNNER_TEMP/notes.txt"

name: MN-GEO-RAIL-001 G3 original DGT 76 truly new tile independent no-credentials preflight
on:
  push:
    branches:
      - mn-geo-rail-001-g3-native76-safe-preflight-20261031
    paths:
      - .github/workflows/mn-geo-g3-native76-safe-preflight.yml
permissions:
  contents: read
jobs:
  verify-public-source-IDs-without-secrets:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g3-native76-safe-preflight-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only original DGT raster QA libraries; no DGT credentials
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'numpy>=1.24,<3' 'requests>=2.32,<3'
      - name: Verify synthetic native 2m raster and source selection guards
        run: python -m unittest discover -s tests -p 'test_geo_rail_g3_native80.py' -v
      - name: Fetch original DGT metadata shortlist from successful real DSM+OSM G3 with SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 100             "https://github.com/r-sousa/mobilidade-public-sources/releases/download/mn-geo-rail-001-g3-real-DSM-OSM-DGT2m-catalog-lattice-41211968220/G3-real-source-2km-study.json"             --output "$RUNNER_TEMP/G3-reviewed-original-80.json"
          echo "ab001fb17ba359d939294b505bc199d459d474095f255f17099c1cdaafd57d9c  $RUNNER_TEMP/G3-reviewed-original-80.json" | sha256sum -c -
      - name: Verify 76 new official source IDs, 19 grids, 3 bounded protected batch sizes and NO acquired-source overlaps
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          from geo_rail_g3_native80 import load_review,batch_groups,BATCHES
          from geo_rail_pt_cdd_grid12 import GRID_TILES
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])/"G3-reviewed-original-80.json"
          gs=load_review(temp)
          ids=[item for g in gs for item in g["tile_ids"]]
          assert len(gs)==19 and len(ids)==len(set(ids))==76
          assert {k:len(batch_groups(gs,k)) for k in BATCHES}==BATCHES
          old=json.loads(pathlib.Path("configs/MN-GEO-RAIL-001-B1-DGT32-source-IDs.json").read_text())
          previous={v for g in old["groups"] for v in g["tile_ids"]}
          mirandela={v[2] for v in GRID_TILES}|{"MDT-2m-279503-09-2024"}
          assert len(previous)==32 and len(mirandela)==13
          assert not(set(ids)&(previous|mirandela)),"old original DGT native tiles must never be downloaded twice"
          assert all(g["group_id"].startswith("G3-") for g in gs)
          print("G3_REAL_OFFICIAL_SOURCE_IDS_PRECHECK_PASS",{
            "source_selected_2km_sectors":len(gs),
            "unacquired_producer_original_tile_ids":len(ids),
            "batch_groups":BATCHES,
            "previous_original_source_ids_excluded":len(previous|mirandela),
            "four_Mirandela_original_sources_intentionally_reused":4,
            "native_DGT_raster_pixels_acquired_by_this_job":0})
          PY

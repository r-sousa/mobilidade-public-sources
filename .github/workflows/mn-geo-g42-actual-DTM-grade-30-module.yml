name: MN-GEO-RAIL-001 G42 measured ground constrained grade LP and all30 sector diversity
on:
  push:
    branches:
      - mn-geo-rail-001-g42-3D-grade-feasibility-and-module-20261101
      - main
    paths:
      - tools/geo_rail_g42_original_terrain_LP_all30_module_evidence.py
      - tests/test_geo_rail_g42_original_terrain_lp.py
      - .github/workflows/mn-geo-g42-actual-DTM-grade-30-module.yml
permissions:
  contents: read
jobs:
  branch-measured-ground-vertical-research:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g42-3D-grade-feasibility-and-module-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scipy linear programming and original projected research source geometry
        run: python -m pip install --disable-pip-version-check 'scipy>=1.12,<2' 'numpy>=1.26,<3' 'shapely>=2.1,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: Check exactly solvable grade mathematics and no invented terrain
        run: |
          python -m py_compile tools/geo_rail_g42_original_terrain_LP_all30_module_evidence.py
          python -m unittest discover -s tests -p 'test_geo_rail_g42_original_terrain_lp.py' -v
      - name: Download only existing G10 G30 G35 G36 G39 G40 source-validated results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' --dir "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g30-tunnel-aware-new-corridors-41278684148 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G30-three-new-Natura-aware-study-routes.geojson' --dir "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g35-previous-station-work-all30-41283129280 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G35-all30-reuse-351-prior-station-physical-screen.json' --dir "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g36-robust-all30-41283618546 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G36-30-all-90-technical-service-environmental-sensitivity.json' --dir "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g39-real-6km-IGN-MDT25-41306354452 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G39-6km-Zamora-13-original-ground-samples-with-source-QA.json' --dir "$RUNNER_TEMP/G42"
          gh release download mn-geo-rail-001-g40-four-actual-IGN25-terrain-41316860509 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G40-four-original-IGN-terrain-research-profiles.json' --dir "$RUNNER_TEMP/G42"
          echo "77d226cc842d33e2f799f2c269ddde57a17cb7d868791770c1624dda1b86136d  $RUNNER_TEMP/G42/G10-27-research-real-source-paths.geojson" | sha256sum -c -
      - name: First mathematical rail-research grade profiles over TRUE actual original IGN bare-earth pixels and full30 study-route sectors
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g42_original_terrain_LP_all30_module_evidence.py \
            --g10 "$RUNNER_TEMP/G42/G10-27-research-real-source-paths.geojson" \
            --g30 "$RUNNER_TEMP/G42/G30-three-new-Natura-aware-study-routes.geojson" \
            --g35 "$RUNNER_TEMP/G42/G35-all30-reuse-351-prior-station-physical-screen.json" \
            --g36 "$RUNNER_TEMP/G42/G36-30-all-90-technical-service-environmental-sensitivity.json" \
            --g39 "$RUNNER_TEMP/G42/G39-6km-Zamora-13-original-ground-samples-with-source-QA.json" \
            --g40 "$RUNNER_TEMP/G42/G40-four-original-IGN-terrain-research-profiles.json" \
            --json "$RUNNER_TEMP/G42/G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json" \
            --csv "$RUNNER_TEMP/G42/G42-30-route-real-geographic-modules.csv" \
            --markdown "$RUNNER_TEMP/G42/G42-first-real-ground-mathematical-rail-grade-constraints.md" \
            --segments "$RUNNER_TEMP/G42/G42-30-route-sector-distinct-source-lattice-options.png" \
            --profile "$RUNNER_TEMP/G42/G42-G39-Zamora-6km-ground-vs-optimized-18-25permille.png"
          python - <<'PY'
          import os,pathlib,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G42"
          j=json.loads((p/"G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json").read_text())
          assert j["original_G10_27_G30_3_preserved"] and j["original_count"]==30
          assert len(j["source_30_options_geographic_five_module_summary"])==5
          assert len(j["full30_individual_five_segment_research_geometry"])==30
          assert len(j["G39_500m_plus_G40_5km_measured_bareearth_constrained_vertical_optimistic_only"])==5
          assert j["original_G35_seven_physical_studies_reused_not_redesigned"]
          assert j["G30_avoid_and_tunnel_east_identical_sample_ground_not_independent_rail_design"]
          assert j["no_new_original_source_data_acquired"] and j["no_earthwork_structure_quantities_or_time_CAPEX"]
          assert j["no_vertical_curves_or_geology_or_water_Natura_PIC_clearance"]
          assert j["PT_ES_altimetric_datum_unharmonized"] and not j["Fxx_accepted"] and not j["Site_authorized"]
          for name in ("G42-30-route-sector-distinct-source-lattice-options.png","G42-G39-Zamora-6km-ground-vs-optimized-18-25permille.png"):
              assert (p/name).stat().st_size>20000
          print("G42 MATHEMATICAL ENGINEERING CONDITIONS grounded in native source, all30 source geographic segments preserved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G42-real-ground-grade-LP-all30-research-modules
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G42/G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json
            ${{ runner.temp }}/G42/G42-30-route-real-geographic-modules.csv
            ${{ runner.temp }}/G42/G42-first-real-ground-mathematical-rail-grade-constraints.md
            ${{ runner.temp }}/G42/G42-30-route-sector-distinct-source-lattice-options.png
            ${{ runner.temp }}/G42/G42-G39-Zamora-6km-ground-vs-optimized-18-25permille.png
  main-G42-verified-publish:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact tested producer script and checked G42 results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g42-actual-DTM-grade-30-module.yml"
          b="mn-geo-rail-001-g42-3D-grade-feasibility-and-module-20261101"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$id" && test "$id" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')"
          file="tools/geo_rail_g42_original_terrain_LP_all30_module_evidence.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$sha" --jq '.sha')" = "$(git hash-object "$file")"
          mkdir -p "$RUNNER_TEMP/G42pub"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G42-real-ground-grade-LP-all30-research-modules \
            --dir "$RUNNER_TEMP/G42pub"
          python - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G42pub"
          d=json.loads((p/"G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json").read_text())
          assert d["original_G10_27_G30_3_preserved"] and len(d["source_30_options_geographic_five_module_summary"])==5
          assert d["no_earthwork_structure_quantities_or_time_CAPEX"] and d["no_vertical_curves_or_geology_or_water_Natura_PIC_clearance"]
          assert d["original_G35_seven_physical_studies_reused_not_redesigned"] and not d["Fxx_accepted"]
          PY
      - name: Publish native source based first optimistic constrained grade rail study and module duplicate report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G42pub"
          gh release create "mn-geo-rail-001-g42-real-railgrade-limits-all30-$GITHUB_RUN_ID" \
            "$d/G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json" \
            "$d/G42-30-route-real-geographic-modules.csv" \
            "$d/G42-first-real-ground-mathematical-rail-grade-constraints.md" \
            "$d/G42-30-route-sector-distinct-source-lattice-options.png" \
            "$d/G42-G39-Zamora-6km-ground-vs-optimized-18-25permille.png" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G42 real 25m bare-earth sampled grade-constrained vertical math and independent geographic modules of all30" \
            --notes "Original source-based terrain, true 13 native IGN samples at 500m G39 and 36 at 5km G40, evaluated via mathematical minimax vertical profile under 18/25permille gradients with both free vs ground-fixed endpoints. These are optimistic *necessary-condition* source sample engineering envelopes not tracks or tunnels/costs. Splits ALL 27 G10+3 G30 into actual 5 contiguous source-lattice modules using 4 mandatory-city grid anchors, reports shared/unique alternatives; historic G35 7 station sites retained. No operational speed/time, legal Natura/PIC or site approval, no new original DGT/IGN source acquisition/Fxx/Site."

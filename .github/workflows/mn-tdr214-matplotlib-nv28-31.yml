name: NORTE 2040 — Matplotlib visual catalogue render 2
on:
  push:
    branches: [main]
    paths: ['extraction_requests/MN-TDR214-MATPLOTLIB-NV28-31.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mn-tdr214-matplotlib-nv28-31
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned renderer
        run: python3 -m pip install matplotlib==3.10.8 numpy==2.4.4
      - name: Render and store in private catalogue
        run: python3 src/mn_public_acquisition/tdr214_matplotlib_bridge_2.py

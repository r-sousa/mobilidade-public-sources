name: MN-GEO-RAIL-001 W3 regional five-point transect

on:
  push:
    branches:
      - mn-geo-rail-001-es-wcs-20261030
    paths:
      - .github/workflows/mn-geo-es-transect.yml
      - tools/geo_rail_es_transect.py
      - tests/test_geo_rail_es_transect.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-geo-rail-001-w3-transect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-backed-transect:
    if: github.ref == 'refs/heads/mn-geo-rail-001-es-wcs-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial validator and projection
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'pyproj>=3.6,<4'
      - name: Enforce sample scope and geographic data sources
        run: python -m unittest discover -s tests -p 'test_geo_rail_es_transect.py' -v
      - name: Probe 5 sourced locations at MDT25 and MDT05, maximum 1 km² each
        id: pilot
        shell: bash
        run: |
          if python tools/geo_rail_es_transect.py \
            --output=reports/mn-geo-rail-001/es-five-site-transect-samples.json; then
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save safe metadata receipt only
        shell: bash
        run: |
          set -euo pipefail
          receipt=reports/mn-geo-rail-001/es-five-site-transect-samples.json
          cp "$receipt" "$RUNNER_TEMP/mn-geo-w3-samples.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$receipt")"
            cp "$RUNNER_TEMP/mn-geo-w3-samples.json" "$receipt"
            git add "$receipt"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data(geo): preserve W3 five-site MDT sample receipts (not rasters)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
      - name: Fail if any sample unverified without erasing evidence
        env:
          SAMPLE_FAILED: ${{ steps.pilot.outputs.failed }}
        run: |
          if [[ "$SAMPLE_FAILED" == "true" ]]; then
            echo "One or more WCS sample windows failed; inspect persisted status" >&2
            exit 1
          fi

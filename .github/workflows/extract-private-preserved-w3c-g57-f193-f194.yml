name: Extract W3C G57 F193/F194 private-preserved public PDFs

on:
  push:
    branches: [main]
    paths:
      - 'extraction_requests/W3C-G57-F193-F194-PUBLIC-PDFS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mn-w3c-g57-f193-f194-public-pdfs
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'pdfplumber==0.11.7'
      - name: Extract exact preserved public PDFs
        run: |
          mkdir -p "$RUNNER_TEMP/mn-w3c-g57"
          python -m mn_public_acquisition.extract_w3c_g57_public_pdfs \
            recovery_specs/w3c-g57-f193-f194-public-pdfs.yml \
            --out "$RUNNER_TEMP/mn-w3c-g57/result.json"
      - name: Preserve bounded runner result diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-g57-f193-f194-result-${{ github.run_id }}
          path: ${{ runner.temp }}/mn-w3c-g57/result.json
          if-no-files-found: ignore
          retention-days: 3

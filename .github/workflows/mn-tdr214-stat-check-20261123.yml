name: TdR 2.1.4 - Employment and modal statistics check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mn-tdr214-stat-check-20261123.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check official statistics
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json, concurrent.futures
          geo=['PT11','PT111','PT112','PT119','PT11A','PT11B','PT11C','PT11D','PT11E']
          url='https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nama_10r_3empers?'+urllib.parse.urlencode([('lang','EN'),('nace_r2','B-E'),('time','2023')]+[('geo',g) for g in geo])
          def work(name,u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r: d=json.load(r)
                  if name=='EMP':
                      print('EMP_RESULT',json.dumps(d,ensure_ascii=False),flush=True)
                  else:
                      if isinstance(d,list):
                          for x in d:
                              if isinstance(x,dict):
                                  print('INE_RESULT',name,json.dumps({k:v for k,v in x.items() if k!='Dados'},ensure_ascii=False)[:4500],str(list(x.get('Dados',{}).items())[:1])[:1500],flush=True)
                      else: print('INE_RESULT',name,str(d)[:300],flush=True)
              except Exception as e: print(name,'ERROR',str(e),flush=True)
          jobs=[('EMP',url)]+[(str(i),'https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd='+str(i).zfill(7)+'&lang=PT') for i in range(14148,14156)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as e:
              list(e.map(lambda p:work(*p),jobs))
          PY

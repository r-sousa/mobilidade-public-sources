name: POCTEP 2021-2027 approved-projects register
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/poctep-inventory.yml"
      - "external/poctep/poctep_inventory.py"
      - "external/poctep/normalise.py"
      - "external/poctep/thematic_tags.py"
permissions:
  contents: write
concurrency:
  group: poctep-projects-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official POCTEP spreadsheets and retain provenance
        shell: bash
        run: |
          set -euo pipefail
          python external/poctep/poctep_inventory.py
          python external/poctep/normalise.py
          python external/poctep/thematic_tags.py
      - name: Update permanent register on unprotected data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/poctep_snapshot"
          cp -a external/poctep/data "$RUNNER_TEMP/poctep_snapshot/data"
          rm -rf external/poctep/data
          git fetch origin poctep-data || true
          if git show-ref --verify --quiet refs/remotes/origin/poctep-data; then
            git switch -C poctep-data origin/poctep-data
          else
            git switch -c poctep-data
          fi
          rm -rf external/poctep/data
          mkdir -p external/poctep
          cp -a "$RUNNER_TEMP/poctep_snapshot/data" external/poctep/data
          git add external/poctep/data
          if git diff --staged --quiet; then
            echo "No source changes"
          else
            git commit -m "POCTEP: refresh official project source register and QA"
            git push origin HEAD:refs/heads/poctep-data
          fi
      - name: Publish a readable execution summary
        if: always()
        shell: bash
        run: |
          echo "## POCTEP inventory bridge" >> "$GITHUB_STEP_SUMMARY"
          if test -f external/poctep/data/quality.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open("external/poctep/data/quality.json"))
          print(f"* Candidate project codes: {x['unique_codes_detected_regex']}")
          print(f"* Official declared total: {x['official_project_total_2026_11']}")
          print(f"* Validation: {x['project_register_status']}")
          for k,v in x["regex_counts_by_call"].items(): print(f"* {k}: {v}")
          PY
          else
            echo "Source retrieval/validation did not complete: check job logs and discovery.json." >> "$GITHUB_STEP_SUMMARY"
          fi

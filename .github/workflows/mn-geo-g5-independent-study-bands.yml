name: MN-GEO-RAIL-001 G5 source-verified spatially distinct research bands (NOT rail alignments)
on:
  push:
    branches:
      - mn-geo-rail-001-g5-distinct-research-corridors-20261031
      - main
    paths:
      - tools/geo_rail_g5_independent_research_bands.py
      - tests/test_geo_rail_g5_research_bands.py
      - .github/workflows/mn-geo-g5-independent-study-bands.yml
permissions:
  contents: write
jobs:
  verify-G5-actual-DSM-3-modules:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial source-grounded methods
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Validate source code + route uniqueness tests before source download
        run: |
          python -m py_compile tools/geo_rail_g5_independent_research_bands.py
          python -m unittest discover -s tests -p 'test_geo_rail_g5_research_bands.py' -v
      - name: Acquire existing immutable 30m DSM and G4 source-only QA, not new DGT rasters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G5-sources"
          base="https://github.com/r-sousa/mobilidade-public-sources/releases/download"
          curl --fail --location --silent --show-error --retry 3 --max-time 220 "$base/mn-geo-rail-001-r1-airport-zamora-dsm-preacceptance-41198485197/MN-GEO-RAIL-001-AFSC-Zamora-GLO30-DSM-1arcsec.tif" --output "$RUNNER_TEMP/G5-sources/copernicus-GLO30-source-DSM.tif"
          echo "a708b502b2eb86236c70f2d74322e9d8e2ea1417eb24094d0e43536845407bd9  $RUNNER_TEMP/G5-sources/copernicus-GLO30-source-DSM.tif" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$base/mn-geo-rail-001-g4-real-DGT2m-cover-gaps-41231342925/G4-actual-original-DGT2m-terrain-cover-and-five-link-gaps.json" --output "$RUNNER_TEMP/G5-sources/G4-real-DGT-2m-source-QA.json"
          echo "7d7a513fd248fcef86453da1967baf20d7359e9f66672fd7e5c4d2e7899ed200  $RUNNER_TEMP/G5-sources/G4-real-DGT-2m-source-QA.json" | sha256sum -c -
      - name: Measure distinct geography using 30m raster and source-verified DGT2m metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g5_independent_research_bands.py \
            --dsm "$RUNNER_TEMP/G5-sources/copernicus-GLO30-source-DSM.tif" \
            --g4 "$RUNNER_TEMP/G5-sources/G4-real-DGT-2m-source-QA.json" \
            --b1 reports/mn-geo-rail-001/B1-DGT-native-2m-32km2-verified-ground-sector-review.json \
            --catalogues reports/mn-geo-rail-001 \
            --geojson "$RUNNER_TEMP/G5-research-bands-EPSG4326.geojson" \
            --report "$RUNNER_TEMP/G5-three-modules-real-source-route-screens.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          q=json.loads((root/"G5-three-modules-real-source-route-screens.json").read_text())
          f=json.loads((root/"G5-research-bands-EPSG4326.geojson").read_text())
          assert len(q["legs"])==3 and len(f["features"])==sum(len(l["variants"]) for l in q["legs"])*2
          assert q["Sanabria_excluded"] and not q["Fxx_accepted"] and not q["Site_authorized"]
          assert q["existing_native_DGT_MDT2m_original_area_km2"]==121
          assert q["geometric_line_is_centres_of_exploratory_2km_sector_not_rail_track"]
          assert q["no_authorized_rail_curvature_grade_tunnel_viaduct_cost_or_travel_time"]
          assert all(len(z["variants"])>=1 for z in q["legs"])
          print("G5_SOURCE_CHECKED: actual raster/metadata, three connectivity research modules, every alternative source/geometry auditable; no engineering claim")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G5-three-module-real-DSM-research-bands
          path: |
            ${{ runner.temp }}/G5-three-modules-real-source-route-screens.json
            ${{ runner.temp }}/G5-research-bands-EPSG4326.geojson
          retention-days: 30
          if-no-files-found: error
      - name: Release source-tested distinct corridor screens on protected main only (preacceptance)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g5-distinct-research-bands-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/G5-three-modules-real-source-route-screens.json" "$RUNNER_TEMP/G5-research-bands-EPSG4326.geojson" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MN-GEO-RAIL-001 G5 measured 30m DSM source research envelopes, not railway alignments" \
            --notes "Actual SHA-pinned regional Copernicus DSM and DGT2m preacceptance QA, three research legs: AFSC–Vila Real, Vila Real–Bragança, Bragança–Zamora. Distinct path screening on 2km raster cells, 3km half-width research buffers and documented native 2m coverage. Geographic separation does NOT establish service accessibility, rail gradients, engineering alignments, speeds, tunnel/viaduct needs or costs. Vila Real + Bragança mandatory service areas; city centre stations not assumed, Sanabria excluded. This is source-backed investigation only, not Fxx/Site."

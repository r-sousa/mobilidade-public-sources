name: F68 exact access diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/f68-access-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: mn-f68-access-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Verify existing token Actions read without retrieving source bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, json, os, base64, datetime
          api='https://api.github.com/repos/r-sousa/EU-transp-weekly'
          branch='mobilidade-norte-recovery-20260919'
          token=os.environ.get('SINK_TOKEN','').strip()
          assert token, 'Existing sink credential unavailable'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(path, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(api+path,data=data,headers={**headers,'Content-Type':'application/json'},method=method),timeout=45) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code,{}
          code, repo=request('')
          assert code==200 and repo.get('private') is True, 'Private destination verification failed'
          code, meta=request('/actions/artifacts/10576315158')
          exact=code==200 and meta.get('size_in_bytes')==897711292 and meta.get('digest')=='sha256:9e3889f0999a7567a6442d1d44e309ae283efb7fdf0507ff4245657fb526df75' and not meta.get('expired')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          download_status=None
          if exact:
              try:
                  r=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(api+'/actions/artifacts/10576315158/zip',headers=headers),timeout=45)
                  download_status=r.status
                  r.close()
              except urllib.error.HTTPError as e:
                  download_status=e.code
          result={'task_id':'G62-F68-ACCESS-RESCUE','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'diagnostic_run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT']),'credential':'MN_PRIVATE_SINK_TOKEN','artifact_id':10576315158,'metadata_http_status':code,'artifact_identity_verified':exact,'download_authorization_http_status':download_status,'source_bytes_acquired':0,'token_or_signed_url_disclosed':False,'status':'PASS_EXISTING_TOKEN_ACTIONS_READ' if exact and download_status==302 else 'BLOCKED_ACCESS'}
          path='/contents/statistics/recovery-20260920/simple-runtime/outputs/ORCHESTRATOR/G62-F68-ACCESS-RESCUE/permission-verified-'+os.environ['RUN_ID']+'-'+os.environ['RUN_ATTEMPT']+'.json'
          body={'branch':branch,'message':'F68: persist user-updated existing credential permission test','content':base64.b64encode((json.dumps(result,indent=2)+'\n').encode()).decode()}
          written,_=request(path,'PUT',body)
          assert written in (200,201), 'Private result write failed'
          print(result['status'])
          assert result['status']=='PASS_EXISTING_TOKEN_ACTIONS_READ', 'Artifact-read permission not verified'
          PY

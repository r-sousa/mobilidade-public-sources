name: Extract W4C F25 F26 preserved INE ingress

on:
  push:
    branches: [main]
    paths:
      - 'extraction_requests/W4C-G46-F25-F26-INE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mn-w4c-g46-f25-f26-ine-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact preserved bytes and emit F25 F26 source-native ingress
        run: |
          mkdir -p "$RUNNER_TEMP/mn-w4c-f25-f26"
          python -m mn_public_acquisition.run_w4c_ine_census_pair recovery_specs/w4c-g46-f25-f26-ine.yml --out "$RUNNER_TEMP/mn-w4c-f25-f26/result.json"
      - name: Preserve bounded execution result diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4c-f25-f26-result-${{ github.run_id }}
          path: ${{ runner.temp }}/mn-w4c-f25-f26/result.json
          if-no-files-found: ignore
          retention-days: 3

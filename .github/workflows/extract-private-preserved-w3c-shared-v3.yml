name: Extract inventory-mapped W3C preserved aviation and ports members

on:
  push:
    branches: [main]
    paths:
      - 'extraction_requests/W3C-G39-SHARED-INVENTORY-MAPPED-R8.json'

permissions:
  contents: read

concurrency:
  group: mn-w3c-shared-inventory-mapped
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Extract inventory-mapped W3C members
        run: |
          mkdir -p "$RUNNER_TEMP/mn-w3c-shared-v3"
          python -m mn_public_acquisition.run_w3c_shared_v3 recovery_specs/w3c-shared-aviation-ports-v3.yml --out "$RUNNER_TEMP/mn-w3c-shared-v3/result.json"
      - name: Preserve bounded result diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-shared-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/mn-w3c-shared-v3/result.json
          if-no-files-found: ignore
          retention-days: 3

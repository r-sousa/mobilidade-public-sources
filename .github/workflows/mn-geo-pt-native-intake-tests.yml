name: MN-GEO-RAIL-001 W2 registered DGT native intake dry-run

on:
  push:
    branches:
      - mn-geo-rail-001-pt-public-stac-20261030
    paths:
      - .github/workflows/mn-geo-pt-native-intake-tests.yml
      - tools/geo_rail_pt_native_intake_qa.py
      - tests/test_geo_rail_pt_native_intake_qa.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-native-intake-contract-on-synthetic-raster:
    if: github.ref == 'refs/heads/mn-geo-rail-001-pt-public-stac-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raster verification dependencies for synthetic test only
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2'
      - name: Test metadata contract, CRS, resolution, NoData and safe receipt
        run: python -m unittest discover -s tests -p 'test_geo_rail_pt_native_intake_qa.py' -v
      - name: Enforce no real credentials or raster in runner
        run: |
          test ! -e .dgt
          echo 'Only synthetic GeoTIFFs were created in Python temp directories; no DGT login, no user data.'

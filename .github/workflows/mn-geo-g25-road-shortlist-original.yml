name: MN-GEO-RAIL-001 G25 remeasure road-to-shifted-G24 site references OSRM (mandatory cities)
on:
  push:
    branches:
      - mn-geo-rail-001-g25-shortlist-road-reference-20261101
      - main
    paths:
      - tools/geo_rail_g25_OSRM_original_G24_road_shortlist.py
      - tests/test_geo_rail_g25_road_shortlist.py
      - .github/workflows/mn-geo-g25-road-shortlist-original.yml
permissions:
  contents: write
jobs:
  actual_OSRM_2_city_table_queries_G24_ground_shortlist:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original OSM source geometry dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Validate bounded public road-access queries and no imaginary shifted access
        run: |
          python -m py_compile tools/geo_rail_g25_OSRM_original_G24_road_shortlist.py
          python -m unittest discover -s tests -p test_geo_rail_g25_road_shortlist.py -v
      - name: Reuse exact immutable SHA-pinned G24 source geometry shortlist and DGT pre-engineering context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G25-source"
          gh release download mn-geo-rail-001-g24-grid-vs-native-city-geometry-41258973762 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G24-source-corridor-vs-351-city-ground-geometry-screens.json' --dir "$RUNNER_TEMP/G25-source"
          echo "19c165db201356aa497ec3915bb2794e8c51e6eff596fc37a9a310d77b30c303  $RUNNER_TEMP/G25-source/G24-source-corridor-vs-351-city-ground-geometry-screens.json" | sha256sum -c -
      - name: Exactly 2 low-rate OSRM public demo real road-network route tables for mandatory city center to moved DGT2m study points
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g25_OSRM_original_G24_road_shortlist.py \
            --g24 "$RUNNER_TEMP/G25-source/G24-source-corridor-vs-351-city-ground-geometry-screens.json" \
            --json "$RUNNER_TEMP/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" \
            --markdown "$RUNNER_TEMP/G25-mandatory-city-road-access-source-ground-comparison.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((p/"G25-OSRM-real-road-access-to-original-ground-site-shortlist.json").read_text())
          assert j["OSRM_source_real_network_table_queries"]==2
          assert j["G24_same_city_original_study_shortlist_rows"]>=13
          assert len(j["source_shortlisted_road_reference_route_cases"])==j["G24_same_city_original_study_shortlist_rows"]
          assert j["deduplicated_unique_G24_road_target_points"]<=32*2
          assert j["source_road_snap_max_m"]==600
          assert j["two_compulsory_cities"]==["Vila Real","Bragança"] and j["Sanabria_excluded"]
          assert all(v["road_time_unavailable_is_NULL_and_not_zero"] and v["not_a_legal_station_road_access_or_last_mile"] for v in j["source_shortlisted_road_reference_route_cases"])
          assert j["road_times_to_moved_positions_NOW_measured_without_imputing_original"]
          assert not j["Fxx_accepted"] and not j["Site_authorized"]
          print("G25: real two mandatory-city OSRM road network route tables; new shifted study site travel snapshots, no false station last-mile or budget")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G25-real-road-to-shifted-mandatory-research-site-references
          path: |
            ${{ runner.temp }}/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json
            ${{ runner.temp }}/G25-mandatory-city-road-access-source-ground-comparison.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish G25 original OSM road travel-time evidence only on protected main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g25-original-road-shortlist-G24-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$RUNNER_TEMP/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" \
            "$RUNNER_TEMP/G25-mandatory-city-road-access-source-ground-comparison.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G25 actual OSRM road route city centre to new DGT 2m study shortlisted sites at Vila Real and Braganca" \
            --notes "2 low-rate OSM OSRM public routing-table calls, one per mandatory market, with 600m road-snap check both ends, snapped city reference-to-nearest-road research point. Do not presume legal station road access, passenger catchments, network availability of public transport, train service, curvature feasibility, site land rights, structure quantities or cost. Source G24 29 shortlisted study rows reuse original exact DGT/route evidence. Changed access time measured anew, no copying original G20 city time to moved positions. Sanabria excluded, no Fxx/Site or new DGT downloads."

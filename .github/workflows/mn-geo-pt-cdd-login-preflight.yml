name: MN-GEO-RAIL-001 W2 DGT login HTTPS public preflight

on:
  push:
    branches:
      - mn-geo-rail-001-pt-public-stac-20261030
    paths:
      - .github/workflows/mn-geo-pt-cdd-login-preflight.yml
      - tools/geo_rail_pt_cdd_login_preflight.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-geo-rail-001-cdd-anonymous-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-login-form-without-secrets:
    if: github.ref == 'refs/heads/mn-geo-rail-001-pt-public-stac-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTPS requests, no secrets
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Verify public portal, Keycloak form and TLS only
        id: check
        shell: bash
        run: |
          if python tools/geo_rail_pt_cdd_login_preflight.py \
             --output=reports/mn-geo-rail-001/pt-dgt-anonymous-login-https-preflight.json; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist safe status-only receipt on feature branch
        shell: bash
        run: |
          set -euo pipefail
          receipt=reports/mn-geo-rail-001/pt-dgt-anonymous-login-https-preflight.json
          cp "$receipt" "$RUNNER_TEMP/mn-cdd-login-public-check.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$receipt")"
            cp "$RUNNER_TEMP/mn-cdd-login-public-check.json" "$receipt"
            git add "$receipt"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(geo): public DGT Keycloak HTTPS form preflight, no credentials"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
      - name: Mark unexpected form or TLS behavior as blocked
        env:
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          if [[ "$FAILED" == 'true' ]]; then
            echo 'Public CDD login form did not pass preflight; do not configure automated login as working.' >&2
            exit 1
          fi

name: MN-GEO-RAIL-001 G40 four original source routes IGN MDT25 ground diversity acquisition
on:
  push:
    branches:
      - mn-geo-rail-001-g40-4-variants-actual-MDT25-20261101
      - main
    paths:
      - tools/geo_rail_g40_all30_reference_four_true_IGN_terrain.py
      - tests/test_geo_rail_g40_four_true_terrain.py
      - .github/workflows/mn-geo-g40-four-real-MDT25-terrain-profiles.yml
permissions:
  contents: read
jobs:
  branch-four-actual-IGN-25m-studies:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g40-4-variants-actual-MDT25-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GIS and actual GeoTIFF pixel QA dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.4,<2' 'pyproj>=3.6,<4' 'shapely>=2.1,<3' 'matplotlib>=3.8,<4'
      - name: Test all30 and four source profiles without false rail design
        run: |
          python -m py_compile tools/geo_rail_g40_all30_reference_four_true_IGN_terrain.py
          python -m unittest discover -s tests -p 'test_geo_rail_g40_four_true_terrain.py' -v
      - name: Download original G10 G30 G36 G39 and official GISCO EU geography
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G40"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' --dir "$RUNNER_TEMP/G40"
          gh release download mn-geo-rail-001-g30-tunnel-aware-new-corridors-41278684148 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G30-three-new-Natura-aware-study-routes.geojson' --dir "$RUNNER_TEMP/G40"
          gh release download mn-geo-rail-001-g36-robust-all30-41283618546 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G36-30-all-90-technical-service-environmental-sensitivity.json' --dir "$RUNNER_TEMP/G40"
          gh release download mn-geo-rail-001-g39-real-6km-IGN-MDT25-41306354452 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G39-6km-Zamora-13-original-ground-samples-with-source-QA.json' --dir "$RUNNER_TEMP/G40"
          echo '77d226cc842d33e2f799f2c269ddde57a17cb7d868791770c1624dda1b86136d  '"$RUNNER_TEMP/G40/G10-27-research-real-source-paths.geojson" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 12 --max-time 90 \
            --max-filesize 49000000 \
            'https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_01M_2024_4326_LEVL_0.geojson' \
            -o "$RUNNER_TEMP/G40/GISCO-NUTS0-2024-01M.geojson"
      - name: Actual original IGN MDT25 WCS 1km bounded sources at four research variants, different eastern geography
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g40_all30_reference_four_true_IGN_terrain.py \
            --g10 "$RUNNER_TEMP/G40/G10-27-research-real-source-paths.geojson" \
            --g30 "$RUNNER_TEMP/G40/G30-three-new-Natura-aware-study-routes.geojson" \
            --g36 "$RUNNER_TEMP/G40/G36-30-all-90-technical-service-environmental-sensitivity.json" \
            --g39 "$RUNNER_TEMP/G40/G39-6km-Zamora-13-original-ground-samples-with-source-QA.json" \
            --country "$RUNNER_TEMP/G40/GISCO-NUTS0-2024-01M.geojson" \
            --outdir "$RUNNER_TEMP/G40" \
            --json "$RUNNER_TEMP/G40/G40-four-original-IGN-terrain-research-profiles.json" \
            --csv "$RUNNER_TEMP/G40/G40-four-study-routes-actual-IGN25-source-samples.csv" \
            --markdown "$RUNNER_TEMP/G40/G40-all30-4variants-original-IGN25-terrain-review.md" \
            --plot "$RUNNER_TEMP/G40/G40-four-IGN-MDT25-actual-ground-profiles.png" \
            --map "$RUNNER_TEMP/G40/G40-four-IGN-MDT25-research-source-sample-positions.png" \
            --zip "$RUNNER_TEMP/G40/G40-actual-original-IGN-MDT25-WCS-source-tiles.zip"
          python - <<'PY'
          import os,json,hashlib,zipfile,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G40"
          d=json.loads((p/"G40-four-original-IGN-terrain-research-profiles.json").read_text())
          assert d["all_30_portfolio_retained"] and d["all_G10_count"]==27 and d["all_G30_count"]==3
          assert d["original_geo_points"]==36 and len(d["selected_four_research_lattice_lines_not_rail_design"])==4
          assert d["official_ES_1p5km_border_interior_eligible"]<=36
          assert d["G30_avoid_vs_tunnel_eastern_2D_same_ground_not_two_independent_east_solutions"]
          assert d["source_WCS_duplicate_queries_avoided"]>=8
          assert d["original_source_terrain_locations_measured_even_if_reused"]==36
          assert len(d["origin_geography_and_research_route_diversity"])==9
          assert d["no_non_sourced_samples_interpolated"] and d["no_new_DGT_tiles"]
          assert d["PIC_official_source_UNRESOLVED"] and not d["Fxx_accepted"] and not d["Site_authorized"]
          assert d["not_harmonized_PT_ES_vertical_datum"] and d["no_tunnel_bridge_cost_timetable_assessed"]
          with zipfile.ZipFile(p/"G40-actual-original-IGN-MDT25-WCS-source-tiles.zip") as arc:
              sources=[z for z in arc.namelist() if z.endswith(".tif")]
              assert len(sources)==d["actual_IGN_source_original_TIFF_verified_count"]
              checks={hashlib.sha256(arc.read(z)).hexdigest() for z in sources}
              for item in d["source_original_25m_samples_and_sha256"]:
                  if item["source_status"]=="ACTUAL_OFFICIAL_WCS_GEOtiff_QA_PASS":
                      assert item["source_original_SHA256"] in checks
          assert (p/"G40-four-IGN-MDT25-actual-ground-profiles.png").stat().st_size>20000
          print("G40 QA VERIFIED originals:",d["actual_IGN_source_original_TIFF_verified_count"],
                "out of",d["original_geo_points"],"four research scenarios; no rail design")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G40-four-actual-original-IGN-25m-study-profiles
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G40/G40-four-original-IGN-terrain-research-profiles.json
            ${{ runner.temp }}/G40/G40-four-study-routes-actual-IGN25-source-samples.csv
            ${{ runner.temp }}/G40/G40-all30-4variants-original-IGN25-terrain-review.md
            ${{ runner.temp }}/G40/G40-four-IGN-MDT25-actual-ground-profiles.png
            ${{ runner.temp }}/G40/G40-four-IGN-MDT25-research-source-sample-positions.png
            ${{ runner.temp }}/G40/G40-actual-original-IGN-MDT25-WCS-source-tiles.zip
  main-publish-source-verified-G40-only:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict tested source producer file git blob check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g40-four-real-MDT25-terrain-profiles.yml"
          b="mn-geo-rail-001-g40-4-variants-actual-MDT25-20261101"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$run" && test "$run" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')"
          f="tools/geo_rail_g40_all30_reference_four_true_IGN_terrain.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$sha" --jq '.sha')" = "$(git hash-object "$f")"
          mkdir -p "$RUNNER_TEMP/G40-public"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G40-four-actual-original-IGN-25m-study-profiles \
            --dir "$RUNNER_TEMP/G40-public"
          python - <<'PY'
          import json,os,pathlib,zipfile,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G40-public"
          d=json.loads((p/"G40-four-original-IGN-terrain-research-profiles.json").read_text())
          assert d["all_30_portfolio_retained"] and d["original_geo_points"]==36
          assert d["G30_avoid_vs_tunnel_eastern_2D_same_ground_not_two_independent_east_solutions"]
          assert d["source_WCS_duplicate_queries_avoided"]>=8
          assert d["PIC_official_source_UNRESOLVED"] and not d["Fxx_accepted"]
          with zipfile.ZipFile(p/"G40-actual-original-IGN-MDT25-WCS-source-tiles.zip") as z:
              sources=[s for s in z.namelist() if s.endswith(".tif")]
              assert len(sources)==d["actual_IGN_source_original_TIFF_verified_count"]
              checks={hashlib.sha256(z.read(s)).hexdigest() for s in sources}
              for row in d["source_original_25m_samples_and_sha256"]:
                  if row["source_status"]=="ACTUAL_OFFICIAL_WCS_GEOtiff_QA_PASS":
                      assert row["source_original_SHA256"] in checks
          PY
      - name: Publish original 4-option IGN terrain with 30 portfolio preserved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G40-public"
          gh release create "mn-geo-rail-001-g40-four-actual-IGN25-terrain-$GITHUB_RUN_ID" \
            "$d/G40-four-original-IGN-terrain-research-profiles.json" \
            "$d/G40-four-study-routes-actual-IGN25-source-samples.csv" \
            "$d/G40-all30-4variants-original-IGN25-terrain-review.md" \
            "$d/G40-four-IGN-MDT25-actual-ground-profiles.png" \
            "$d/G40-four-IGN-MDT25-research-source-sample-positions.png" \
            "$d/G40-actual-original-IGN-MDT25-WCS-source-tiles.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G40 multiple actual IGN 25m bare-earth research terrain measurements on four geographic variants" \
            --notes "Four different original G10+G30 2km research routes at 15-55 km from Zamora endpoint, true official IGN WCS MDT25 source 1km bounded GeoTIFF requests and SHA checks; actual measures where Spanish-border source coverage permits, no interpolated missing cells. Keeps all 27 G10 and three G30 in full portfolio. Geographic GISCO border generalized. No genuine engineered railway 3D grades/earthworks, station locations or construction cost or Natura/PIC clearance; no new DGT tiles, Fxx or Site."

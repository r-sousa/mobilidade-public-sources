name: MN-GEO-RAIL-001 G14B 2021 INE population source envelopes and map visualisations
on:
  push:
    branches:
      - mn-geo-rail-001-g14-bgri21-demographic-catchments-20261031
      - main
    paths:
      - tools/geo_rail_g14b_bgri_population_visuals.py
      - .github/workflows/mn-geo-g14b-demographic-visuals.yml
permissions:
  contents: write
  actions: read
jobs:
  georeferenced_census_population_visualisation:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public cartographic plotting tools
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'matplotlib>=3.8,<4' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Retrieve completed actual original INE F67 G14 demographic calculations, not re-download 247MB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G14B"
          gh run download 41250624755 --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G14-original-INE-census-geographic-station-population \
            --dir "$RUNNER_TEMP/G14B"
      - name: Plot non-overlapping 2021 demographic geographic coverage with actual georeferenced polygon envelopes
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g14b_bgri_population_visuals.py \
            --input "$RUNNER_TEMP/G14B/G14-BGRI2021-three-families-six-cities-5-10-20km-catchments.json" \
            --unions "$RUNNER_TEMP/G14B/G14B-2021-population-geographic-union-10-20km.png" \
            --cities "$RUNNER_TEMP/G14B/G14B-2021-population-six-markets-circle-10km.png" \
            --geojson "$RUNNER_TEMP/G14B/G14B-real-geographic-10-20km-study-point-envelopes.geojson"
          python - <<'PY'
          import pathlib,os,json
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"G14B"
          js=json.loads((d/"G14B-real-geographic-10-20km-study-point-envelopes.geojson").read_text())
          assert len(js["features"])==36
          assert all(x["properties"]["geographic_buffer_is_NOT_a_road_travel_isochrone"] and x["properties"]["research_reference_is_NOT_a_rail_station"] for x in js["features"])
          for name in ("G14B-2021-population-geographic-union-10-20km.png","G14B-2021-population-six-markets-circle-10km.png"):
            assert (d/name).stat().st_size>10000
          print("G14B verified 36 real-position circles and two source-population diagrams without assuming actual rail service")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G14B-real-census-population-geographic-service-visuals
          path: |
            ${{ runner.temp }}/G14B/G14B-2021-population-geographic-union-10-20km.png
            ${{ runner.temp }}/G14B/G14B-2021-population-six-markets-circle-10km.png
            ${{ runner.temp }}/G14B/G14B-real-geographic-10-20km-study-point-envelopes.geojson
          retention-days: 30
          if-no-files-found: error
      - name: Publish census-derived 2021 resident source graphics after protected main QA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g14b-INE-2021-demographic-circles-visuals-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$RUNNER_TEMP/G14B/G14B-2021-population-geographic-union-10-20km.png" \
            "$RUNNER_TEMP/G14B/G14B-2021-population-six-markets-circle-10km.png" \
            "$RUNNER_TEMP/G14B/G14B-real-geographic-10-20km-study-point-envelopes.geojson" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G14B 2021 INE real census population geography research service envelopes, 3 corridors and 6 markets" \
            --notes "Authentic 2021 INE BGRI subsections, centroid vs area sensitivity, actual G13A research coordinates 36 Euclidean 10/20km geographic buffer polygons and 10/20km non-double-counted unions. Not road isochrones, not municipal population claims, not employment, not approved station sites, not train demand; no new INE data download, Fxx, Site or CAPEX."

name: Mobilidade Norte – TdR 2.1.4 phase 27 cartography
on:
  push:
    branches: [main]
    paths: ['extraction_requests/MN-TDR214-PHASE27-20261123.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mn-tdr214-phase27
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install numpy pandas geopandas shapely pyproj matplotlib
      - run: python3 src/mn_public_acquisition/recover_tdr214_phase27.py

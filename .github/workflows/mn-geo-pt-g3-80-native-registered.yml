name: MN-GEO-RAIL-001 G3 remaining 48 native DGT 2m originals, gap-aware QA (regional 28 already recovered)
# Secret-based DGT acquisition only via explicit manual workflow_dispatch on PROTECTED main.
# Never run DGT credentials on push/PR/release/schedule, never publish credential-bearing links.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mn-geo-rail-001-g3-DGT2m-manual-original-source-80
  cancel-in-progress: false
jobs:
  verify-protected-main:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify main branch remains protected before protected DGT access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          protected="$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/r-sousa/mobilidade-public-sources/branches/main" | jq -r '.protected')"
          [[ "$protected" == "true" ]] || { echo "::error::Reject DGT credential use on unprotected main"; exit 1; }
      - name: Verify the 28 real regional DGT2m source files are independently preserved before excluding that batch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g3-DGT2m-regional-original-recovered-41222195065"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets' > "$RUNNER_TEMP/G3-recovered-regional-assets.json"
          python - <<'PY'
          import json,os,pathlib
          assets=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"G3-recovered-regional-assets.json").read_text())
          assert len(assets)==36, "28 original regional TIFF + 7 mosaics + source-QA receipt not independently archived"
          qa=[x for x in assets if x["name"]=="G3-DGT-native2m-regional-original-source-QA.json"]
          assert len(qa)==1
          assert qa[0]["digest"]=="sha256:74ef0c8cfcf88d78d2747a1f6d85df1ac836087a408feb91bb3f75d0e6d244cd"
          assert len([x for x in assets if x["name"].endswith(".tif")])==35
          print("REGIONAL_28KM2_SOURCE_ARCHIVE_IMMUTABLE_QA_VERIFIED; only 48 outstanding DGT native tiles will be acquired")
          PY
  acquire-reviewed-native-originals:
    needs: verify-protected-main
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: dgt-cdd
    runs-on: ubuntu-latest
    timeout-minutes: 42
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [vila_real, braganca]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed source geospatial validation and DGT HTTP dependencies
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'numpy>=1.24,<3' 'requests>=2.32,<3'
      - name: Offline tests before credentials read, including native source NoData and exact mosaics
        run: |
          python -m unittest discover -s tests -p 'test_geo_rail_g3_native80.py' -v
          python -m unittest discover -s tests -p 'test_geo_rail_g3_native_voids.py' -v
      - name: Retrieve SHA256-pinned reviewed reviewed 80 DGT IDs of which 76 are not previously downloaded from real-source G3 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 100              "https://github.com/r-sousa/mobilidade-public-sources/releases/download/mn-geo-rail-001-g3-real-DSM-OSM-DGT2m-catalog-lattice-41211968220/G3-real-source-2km-study.json"              --output "$RUNNER_TEMP/G3-real-source-2km-study.json"
          echo "ab001fb17ba359d939294b505bc199d459d474095f255f17099c1cdaafd57d9c  $RUNNER_TEMP/G3-real-source-2km-study.json" | sha256sum -c -
      - name: Verify 76 new original source tile IDs (four Mirandela duplicates excluded) and batch geography WITHOUT DGT secrets
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from geo_rail_g3_native80 import load_review,BATCHES,batch_groups
          d=load_review(Path(os.environ["RUNNER_TEMP"])/"G3-real-source-2km-study.json")
          assert len(d)==sum(BATCHES.values())==19, "Expected 19 genuinely new G3 research sectors after Mirandela reuse"
          assert sum(len(g["tile_ids"]) for g in d)==76, "Expected exactly 76 new native producer tile IDs"
          assert len({tid for g in d for tid in g["tile_ids"]})==76, "Duplicate original producer tile IDs"
          assert all(len(batch_groups(d,k))==n for k,n in BATCHES.items())
          print("G3 original-source review passed: exactly 19 disjoint source research groups / 76 new DGT2m tiles (7 Vila Real, 5 Bragança, 7 regional); four already-held Mirandela tiles explicitly excluded")
          PY
      - name: Protected DGT login, retrieve actual producer native 2m pixels and run 4 real source seams per group
        env:
          DGT_CDD_USERNAME: ${{ secrets.DGT_CDD_USERNAME }}
          DGT_CDD_PASSWORD: ${{ secrets.DGT_CDD_PASSWORD }}
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tools/geo_rail_g3_native80.py --review "$RUNNER_TEMP/G3-real-source-2km-study.json"             --batch "$BATCH" --acquire "$RUNNER_TEMP/G3-$BATCH-native-originals"
          python tools/geo_rail_g3_native80.py --review "$RUNNER_TEMP/G3-real-source-2km-study.json"             --batch "$BATCH" --verify "$RUNNER_TEMP/G3-$BATCH-native-originals"
      - name: Upload ONLY verified DGT source GeoTIFF bytes and sanitized SHA256 QA for independent no-DGT-credentials publisher
        uses: actions/upload-artifact@v4
        with:
          name: mn-geo-rail-001-G3-native2m-${{ matrix.batch }}-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/G3-${{ matrix.batch }}-native-originals/
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
  publish-independent-source-QA:
    needs: acquire-reviewed-native-originals
    if: ${{ always() && github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.acquire-reviewed-native-originals.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        batch: [vila_real, braganca]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent non-credentialed raster verification dependencies
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'numpy>=1.24,<3' 'requests>=2.32,<3'
      - name: Fetch exact approved 80 original DGT tile IDs from public source, SHA-verified
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 100             "https://github.com/r-sousa/mobilidade-public-sources/releases/download/mn-geo-rail-001-g3-real-DSM-OSM-DGT2m-catalog-lattice-41211968220/G3-real-source-2km-study.json"             --output "$RUNNER_TEMP/G3-real-source-2km-study.json"
          echo "ab001fb17ba359d939294b505bc199d459d474095f255f17099c1cdaafd57d9c  $RUNNER_TEMP/G3-real-source-2km-study.json" | sha256sum -c -
      - name: Check per-city protected artifact exists independently of other city results
        id: batch_source_available
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          name="mn-geo-rail-001-G3-native2m-${BATCH}-verified-${GITHUB_RUN_ID}"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' | grep -Fxc "$name" || true)"
          if [[ "$count" == "1" ]]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "Original DGT2m source artifact located, independent publisher allowed: $name"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo "No verified artifact for $BATCH; skip this publisher, do NOT invent original DGT source rasters"
          fi
      - uses: actions/download-artifact@v4
        if: steps.batch_source_available.outputs.found == 'true'
        with:
          name: mn-geo-rail-001-G3-native2m-${{ matrix.batch }}-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/G3-${{ matrix.batch }}-independent-QA
      - name: Independently reopen and SHA256-check EVERY original 2m raster, every seam and exact source masks
        if: steps.batch_source_available.outputs.found == 'true'
        env:
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g3_native80.py --review "$RUNNER_TEMP/G3-real-source-2km-study.json"             --batch "$BATCH" --verify "$RUNNER_TEMP/G3-$BATCH-independent-QA"
      - name: Publish native original 2m source rasters and validated mosaics with DGT attribution (no DGT credentials)
        if: steps.batch_source_available.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G3-$BATCH-independent-QA"
          tag="mn-geo-rail-001-g3-original-DGT2m-$BATCH-preacceptance-$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/G3-original-source-terms.txt" <<'NOTE'
          PRODUCER: Direção-Geral do Território (DGT), Centro de Dados, Portugal; reuse under CC BY 4.0 with attribution to DGT.
          Each 1km2 source raster is a verified real producer-original MDT2m GeoTIFF in EPSG3763; reported masks and source NoData retain all original gaps; actual VALID ground pixel counts differ from geometric source tile footprints. No gaps interpolated; exact SHA256 and native-mosaic masks independently reverified. No DGT secrets, authenticated session cookies or source signed URLs published.
          Previously acquired 28km2 regional original sources are already preserved in Release mn-geo-rail-001-g3-DGT2m-regional-original-recovered-41222195065, NOT reacquired. This workflow captures only 28km2 Vila Real and 20km2 Bragança geometrical tile footprints; valid-pixel ground area may be smaller due to original NoData. Source grids are NOT railway track, station, slope, speed or cost designs; no full corridor continuity established. Both Vila Real and Bragança compulsory service areas (station cores not compulsory); Sanabria excluded.
          No independent vertical datum reconciliation PT–ES, no station accessibility network times, no Fxx or Site acceptance.
          NOTE
          gh release create "$tag" "$d"/*.tif "$d"/G3-DGT-native2m-$BATCH-original-source-QA.json             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease             --title "MN-GEO-RAIL-001 G3 actual original DGT 2m $BATCH terrain, independent QA"             --notes-file "$RUNNER_TEMP/G3-original-source-terms.txt"

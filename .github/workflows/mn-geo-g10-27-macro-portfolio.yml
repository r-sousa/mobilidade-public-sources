name: MN-GEO-RAIL-001 G10 expand 27 original macro portfolios and 81 speed reviews
on:
  push:
    branches:
      - mn-geo-rail-001-g10-27-portfolio-combinations-20261031
      - main
    paths:
      - tools/geo_rail_g10_27_macro_portfolio.py
      - tests/test_geo_rail_g10_portfolio.py
      - .github/workflows/mn-geo-g10-27-macro-portfolio.yml
permissions:
  contents: write
jobs:
  source-proven-macro-multicriteria-portfolio:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial reading and public scientific tools
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Validate standalone G10 portfolio and Pareto contracts
        run: |
          python -m py_compile tools/geo_rail_g10_27_macro_portfolio.py
          python -m unittest discover -s tests -p 'test_geo_rail_g10_portfolio.py' -v
      - name: Retrieve public immutable sources for 27 combinations, verify every SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G10-source"
          b="https://github.com/r-sousa/mobilidade-public-sources/releases/download"
          curl --fail --location --silent --show-error --retry 3 --max-time 200 "$b/mn-geo-rail-001-r1-airport-zamora-dsm-preacceptance-41198485197/MN-GEO-RAIL-001-AFSC-Zamora-GLO30-DSM-1arcsec.tif" -o "$RUNNER_TEMP/G10-source/DSM.tif"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$b/mn-geo-rail-001-g3-real-DSM-OSM-DGT2m-catalog-lattice-41211968220/G3-real-source-2km-study.json" -o "$RUNNER_TEMP/G10-source/G3.json"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$b/mn-geo-rail-001-g4-real-DGT2m-cover-gaps-41231342925/G4-actual-original-DGT2m-terrain-cover-and-five-link-gaps.json" -o "$RUNNER_TEMP/G10-source/G4.json"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$b/mn-geo-rail-001-g5-distinct-research-bands-41232865101/G5-three-modules-real-source-route-screens.json" -o "$RUNNER_TEMP/G10-source/G5.json"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 "$b/mn-geo-rail-001-g6-three-complete-territorial-screens-41233103738/G6-3-complete-source-research-chains.json" -o "$RUNNER_TEMP/G10-source/G6.json"
          echo "a708b502b2eb86236c70f2d74322e9d8e2ea1417eb24094d0e43536845407bd9  $RUNNER_TEMP/G10-source/DSM.tif" | sha256sum -c -
          echo "ab001fb17ba359d939294b505bc199d459d474095f255f17099c1cdaafd57d9c  $RUNNER_TEMP/G10-source/G3.json" | sha256sum -c -
          echo "7d7a513fd248fcef86453da1967baf20d7359e9f66672fd7e5c4d2e7899ed200  $RUNNER_TEMP/G10-source/G4.json" | sha256sum -c -
          echo "a4cb8be1443b8be484303934595dfb8ffecaeb6b7857dc0a1ee1569956adfc32  $RUNNER_TEMP/G10-source/G5.json" | sha256sum -c -
          echo "faa2f1d218c79a3647a0d32217ab7bd460cc8aed418750ac62b41844d2d5bc9d  $RUNNER_TEMP/G10-source/G6.json" | sha256sum -c -
      - name: Test all 27 three-module combinations and 81 speed/DSMs without made-up railway costs
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g10_27_macro_portfolio.py \
            --dsm "$RUNNER_TEMP/G10-source/DSM.tif" \
            --g3 "$RUNNER_TEMP/G10-source/G3.json" \
            --g4 "$RUNNER_TEMP/G10-source/G4.json" \
            --g5 "$RUNNER_TEMP/G10-source/G5.json" \
            --g6 "$RUNNER_TEMP/G10-source/G6.json" \
            --b1 reports/mn-geo-rail-001/B1-DGT-native-2m-32km2-verified-ground-sector-review.json \
            --catalogues reports/mn-geo-rail-001 \
            --json "$RUNNER_TEMP/G10-27-combinations-81-speed-source-only.json" \
            --markdown "$RUNNER_TEMP/G10-27-combinations-81-speed-exploration.md"
          python - <<'PY'
          import os,json,pathlib
          r=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((r/"G10-27-combinations-81-speed-source-only.json").read_text())
          assert j["total_combinations"]==27 and len(j["scenario_rows"])==81
          assert j["service_cities"]==["Vila Real","Bragança"] and j["Sanabria_excluded"]
          assert j["all_27_geometrically_distinct_source_lattice_sequences"]
          assert j["G6_three_reference_diagonal_combinations_preserved"]
          assert j["full_original_DGT_ground_coverage_km2"]==121
          assert j["no_actual_cost_euros_or_earthwork_or_tunnel_viaduct_quantities"]
          assert j["no_actual_road_network_intermodality_minutes"]
          assert j["no_actual_train_running_timetable_dwell_or_door_to_door_minutes"]
          assert j["not_new_DGT_auth_downloads"]
          assert not j["Fxx_accepted"] and not j["Site_authorized"]
          print("G10 validated: 27 distinct 2km research paths, 81 DSM 160/200/250 screens, no invented cost/access/time, no secrets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G10-27-portfolio-proxy-matrix
          path: |
            ${{ runner.temp }}/G10-27-combinations-81-speed-source-only.json
            ${{ runner.temp }}/G10-27-combinations-81-speed-exploration.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish G10 source-locked portfolio on main only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g10-27-macro-portfolio-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/G10-27-combinations-81-speed-source-only.json" "$RUNNER_TEMP/G10-27-combinations-81-speed-exploration.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MN-GEO-RAIL-001 G10 27 macro source corridors × 3 speed technical proxies, NOT railway track/time/cost" \
            --notes "27 independently combinatorial G5 regional study modules P1/P3/P5 plus compulsory G3 source-city connectors, all source-pinned to SHA verified GLO30 real DSM and 121km² G4 real DGT2m proof. Three velocity scenario 160/200/250 x 18/25‰ mathematical grade proxies and radius screens. Travel geometry length/speed is a research index ONLY, never a train journey time. DSM grade-profile pressure does NOT represent construction costs, actual tunnel/viaduct volumes or ground bare earth. Station catchment/service and road network intermodal minutes NOT measured, so no unsupported numerical values. No Sanabria, no new authentic source downloads, no Fxx/Site, no approved railway feasibility."

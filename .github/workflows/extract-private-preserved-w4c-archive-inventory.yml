name: Extract W4C preserved archive inventory first

on:
  push:
    branches: [main]
    paths:
      - 'extraction_requests/W4C-G39-ARCHIVE-INVENTORY-FIRST.json'

permissions:
  contents: read

concurrency:
  group: mn-w4c-archive-inventory-first
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run W4C archive-inventory-first operation
        run: |
          mkdir -p "$RUNNER_TEMP/mn-w4c-inventory"
          python -m mn_public_acquisition.run_w4c_archive_inventory recovery_specs/w4c-archive-inventory-first.yml --out "$RUNNER_TEMP/mn-w4c-inventory/result.json"
      - name: Preserve bounded result diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4c-archive-inventory-result-${{ github.run_id }}
          path: ${{ runner.temp }}/mn-w4c-inventory/result.json
          if-no-files-found: ignore
          retention-days: 3

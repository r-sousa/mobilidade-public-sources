name: MN-GEO-RAIL-001 G35 reuse real previous DGT2m station-site studies in all 30 routes
on:
  push:
    branches:
      - mn-geo-rail-001-g35-reuse-physical-stations-all30-20261101
      - main
    paths:
      - tools/geo_rail_g35_prior_station_reuse_all30.py
      - tests/test_geo_rail_g35_prior_station_reuse_all30.py
      - .github/workflows/mn-geo-g35-reuse-station-studies-all30.yml
permissions:
  contents: read
jobs:
  branch-original-station-reuse-crosswalk:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g35-reuse-physical-stations-all30-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse geospatial libraries, do not download new DGT sources
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: G35 tests forbid inventing a buildable station from source
        run: |
          python -m py_compile tools/geo_rail_g35_prior_station_reuse_all30.py
          python -m unittest discover -s tests -p 'test_geo_rail_g35_prior_station_reuse_all30.py' -v
      - name: Reuse exact prior station DGT2m + road + COS + official REN/RAN work and all30 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g30-tunnel-aware-new-corridors-41278684148 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G30-three-new-Natura-aware-study-routes.geojson' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g25-original-road-shortlist-G24-41259277284 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G25-OSRM-real-road-access-to-original-ground-site-shortlist.json' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g27b-COS2025-road-terrain-prelegal-sites-41262006906 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G27B-seven-mandatory-sector-COS2025-road-ground-prelegal-matrix.json' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g27c-DGT-SNIT-original-REN-RAN-CRUS-seven-41262006926 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g32-unified-30-90-41280190620 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G32-full-30-options-90-scenarios.json' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g33-all30-six-city-41281265827 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G33-all30-six-city-access-source.json' --dir "$RUNNER_TEMP/G35"
          gh release download mn-geo-rail-001-g34-all30-original-INE2021-41281574735 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G34-INE2021-all30-six-market-geographic-census.json' --dir "$RUNNER_TEMP/G35"
          echo "be35181c882c2f6ede4d07f7e0a68b084bb6247c54a7da0d1d566a66f844dffd  $RUNNER_TEMP/G35/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" | sha256sum -c -
      - name: Cross-check 7 real former DGT research positions across the full 30-route portfolio
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g35_prior_station_reuse_all30.py \
            --g10 "$RUNNER_TEMP/G35/G10-27-research-real-source-paths.geojson" \
            --g30geo "$RUNNER_TEMP/G35/G30-three-new-Natura-aware-study-routes.geojson" \
            --g25 "$RUNNER_TEMP/G35/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" \
            --g27b "$RUNNER_TEMP/G35/G27B-seven-mandatory-sector-COS2025-road-ground-prelegal-matrix.json" \
            --g27c "$RUNNER_TEMP/G35/G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json" \
            --g32 "$RUNNER_TEMP/G35/G32-full-30-options-90-scenarios.json" \
            --g33 "$RUNNER_TEMP/G35/G33-all30-six-city-access-source.json" \
            --g34 "$RUNNER_TEMP/G35/G34-INE2021-all30-six-market-geographic-census.json" \
            --json "$RUNNER_TEMP/G35/G35-all30-reuse-351-prior-station-physical-screen.json" \
            --csv "$RUNNER_TEMP/G35/G35-30x2-mandatory-city-station-physical-crosswalk.csv" \
            --markdown "$RUNNER_TEMP/G35/G35-previous-station-research-reused-all30.md" \
            --map "$RUNNER_TEMP/G35/G35-all30-7-existing-original-DGT2m-sites-map.png" \
            --geojson "$RUNNER_TEMP/G35/G35-seven-original-station-study-source-XY.geojson"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G35"
          j=json.loads((p/"G35-all30-reuse-351-prior-station-physical-screen.json").read_text())
          assert j["G10_all_routes"]==27 and j["G30_all_routes"]==3
          assert j["original_DGT2m_COS2025_road_study_coordinate_sites"]==7
          assert j["mandatory_city_case_rows"]==60
          assert j["cross_checked_prior_G25_site_family_x_all_current_routes"]>250
          assert j["original_G23B_original_DGT2m_local_cases"]==351
          assert j["original_stations_existing_screened_not_approved"]
          assert j["legal_PIC_unknown"] and j["no_Fxx_or_site"]
          assert j["no_fresh_OSRM_or_original_DGT_2m_or_COS_acquisition"]
          assert len(j["comparisons_all30_times_two_mandatory_cities"])==60
          assert (p/"G35-all30-7-existing-original-DGT2m-sites-map.png").stat().st_size>30000
          print("G35 source QA PASS: original station studies preserved for 30 routes and two cities, not newly designed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G35-previous-physical-station-siting-all30
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G35/G35-all30-reuse-351-prior-station-physical-screen.json
            ${{ runner.temp }}/G35/G35-30x2-mandatory-city-station-physical-crosswalk.csv
            ${{ runner.temp }}/G35/G35-previous-station-research-reused-all30.md
            ${{ runner.temp }}/G35/G35-all30-7-existing-original-DGT2m-sites-map.png
            ${{ runner.temp }}/G35/G35-seven-original-station-study-source-XY.geojson
  main-publish-G35-tested-station-evidence:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact tested producer blob before publishing original station source crosswalk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g35-reuse-station-studies-all30.yml"
          b="mn-geo-rail-001-g35-reuse-physical-stations-all30-20261101"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$run" && test "$run" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')"
          path="tools/geo_rail_g35_prior_station_reuse_all30.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$sha" --jq '.sha')" = "$(git hash-object "$path")"
          mkdir -p "$RUNNER_TEMP/G35-publish"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G35-previous-physical-station-siting-all30 \
            --dir "$RUNNER_TEMP/G35-publish"
          python - <<'PY'
          import pathlib,os,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G35-publish"
          j=json.loads((p/"G35-all30-reuse-351-prior-station-physical-screen.json").read_text())
          assert j["G10_all_routes"]==27 and j["G30_all_routes"]==3 and j["mandatory_city_case_rows"]==60
          assert j["original_DGT2m_COS2025_road_study_coordinate_sites"]==7
          assert j["legal_PIC_unknown"] and j["no_Fxx_or_site"]
          PY
      - name: Publish G35 previously studied physically source-grounded stations vs all30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G35-publish"
          gh release create "mn-geo-rail-001-g35-previous-station-work-all30-$GITHUB_RUN_ID" \
            "$d/G35-all30-reuse-351-prior-station-physical-screen.json" \
            "$d/G35-30x2-mandatory-city-station-physical-crosswalk.csv" \
            "$d/G35-previous-station-research-reused-all30.md" \
            "$d/G35-all30-7-existing-original-DGT2m-sites-map.png" \
            "$d/G35-seven-original-station-study-source-XY.geojson" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G35 REUSE actual G23-G27 previously studied station positions across full G10 27 plus G30 3" \
            --notes "Reconciles seven historical original-DGT2m terrain study positions, G23B 351 study orientations/shift configurations, G24/G25 shortlist source road access, COS2025 7 sectors and source-bounded DGT WFS REN/RAN/CRUS with all 30 geographic research corridors. 60 compulsory city-corridor comparison cases; 160/200/250 pure radius contextual note only. No station engineering, actual rail construction, legal permit, protected site/PIC authorization or new DGT data; no Fxx/Site."

name: MN-GEO-RAIL-001 G57 native DGT2m real bare earth for recovered BR3 BR4 200 radius source curves
on:
  push:
    branches:
      - mn-geo-rail-001-g57-BR3-BR4-recovered-2m-ground-20261103
      - main
    paths:
      - tools/geo_rail_g57_new_BR3_BR4_G56_real_original_DGT2m.py
      - tests/test_geo_rail_g57_recovered_BR_real_native_ground.py
      - .github/workflows/mn-geo-g57-recovered-BR3-BR4-original-DGT2m.yml
permissions:
  contents: read
jobs:
  branch-G57-original-DGT2m-source-on-new-BR-geometry:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g57-BR3-BR4-recovered-2m-ground-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original native DGT2m GeoTIFF source SHA and numerical LP
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: Strict 2 case ground acquisition no imputation fail-closed regression
        run: |
          python -m py_compile tools/geo_rail_g57_new_BR3_BR4_G56_real_original_DGT2m.py
          python -m unittest discover -s tests -p 'test_geo_rail_g57_recovered_BR_real_native_ground.py' -v
      - name: Download original recovered G56 real 2D BR3 BR4 curves and 84 DGT original raster index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G57/originals"
          gh release download mn-geo-rail-001-g56-BR3-BR4-diversity-extended-curves-41638566133 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G56-original-BR3-BR4-G30-diversity-extended-15km-angle-curvature.json' --dir "$RUNNER_TEMP/G57"
          gh release download mn-geo-rail-001-g37-DGT10m-CNIG-LNEG-data-gates-41303761915 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G37-84-original-DGT-ground-source-indices-and-conditional-gates.json' --dir "$RUNNER_TEMP/G57"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/G57/public-release-index.json"
      - name: Retrieve only DGT original 1km tiles needed for actual new sampled G56 geometry, no DGT private credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g57_new_BR3_BR4_G56_real_original_DGT2m.py --mode retrieve \
            --g56 "$RUNNER_TEMP/G57/G56-original-BR3-BR4-G30-diversity-extended-15km-angle-curvature.json" \
            --g37 "$RUNNER_TEMP/G57/G37-84-original-DGT-ground-source-indices-and-conditional-gates.json" \
            --releases "$RUNNER_TEMP/G57/public-release-index.json" \
            --rawdir "$RUNNER_TEMP/G57/originals" \
            --receipts "$RUNNER_TEMP/G57/G57-native-original-DGT-source-reused-SHA.json"
      - name: Verify 2x121 original 2m ground and only if full adjust mixed 12p5/15 rail-grade mathematical lines
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g57_new_BR3_BR4_G56_real_original_DGT2m.py --mode analyze \
            --g56 "$RUNNER_TEMP/G57/G56-original-BR3-BR4-G30-diversity-extended-15km-angle-curvature.json" \
            --g37 "$RUNNER_TEMP/G57/G37-84-original-DGT-ground-source-indices-and-conditional-gates.json" \
            --rawdir "$RUNNER_TEMP/G57/originals" \
            --receipts "$RUNNER_TEMP/G57/G57-native-original-DGT-source-reused-SHA.json" \
            --json "$RUNNER_TEMP/G57/G57-two-recovered-G56-BR3-BR4-original-DGT2m-ground-and-grade.json" \
            --csv "$RUNNER_TEMP/G57/G57-BR3-BR4-new-curvature-actual-DGT2m-25m-ground-samples.csv" \
            --plot "$RUNNER_TEMP/G57/G57-recovered-BR3-BR4-real-ground-and-12p5-15-grade.png" \
            --markdown "$RUNNER_TEMP/G57/G57-recovered-Braganca-geometric-candidates-actual-DGT-ground-technical-review.md"
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G57"
          d=json.loads((p/"G57-two-recovered-G56-BR3-BR4-original-DGT2m-ground-and-grade.json").read_text())
          assert d["full30_G10_G30_original_still_retained"]
          assert d["original_G56_200kmh_BR3_BR4_candidates_resampled_not_G54_old_geometry"]
          assert d["two_old_physical_station_sites"]==["BR3","BR4"]
          assert len(d["two_G56_200kmh_horizontal_research_actual_ground_profiles"])==2
          assert len(d["actual_new_G56_family_specific_DGT2m_25m_sample_rows"])==242
          assert d["no_original_DGT_acquisition_or_new_TIFFs_downloaded_from_DGT"]
          assert d["no_missing_source_pixel_imputation"]
          assert d["BR3_rotated_original_heading_road_access_must_be_resurveyed"]
          assert d["no_guaranteed_200kmh_operating_speed_by_curvature_sample"]
          assert not d["Fxx_accepted"] and not d["Site_authorized"]
          for x in d["two_G56_200kmh_horizontal_research_actual_ground_profiles"]:
              if x["valid_original_2m_ground_n"]<121:
                  assert x["research_grade_3D_when_121_original_ground_points"] is None
          assert (p/"G57-recovered-BR3-BR4-real-ground-and-12p5-15-grade.png").stat().st_size>15000
          print("G57 verified two 200 sampled curvature G56 native DGT original profiles no artificial ground/grade")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G57-original-DGT2m-recovered-BR3-BR4
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G57/G57-two-recovered-G56-BR3-BR4-original-DGT2m-ground-and-grade.json
            ${{ runner.temp }}/G57/G57-BR3-BR4-new-curvature-actual-DGT2m-25m-ground-samples.csv
            ${{ runner.temp }}/G57/G57-recovered-BR3-BR4-real-ground-and-12p5-15-grade.png
            ${{ runner.temp }}/G57/G57-recovered-Braganca-geometric-candidates-actual-DGT-ground-technical-review.md
            ${{ runner.temp }}/G57/G57-native-original-DGT-source-reused-SHA.json
  main-G57-verified-original-source-publisher:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check producer blob and source curve two stations guardrails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exact successful original producer run was independently inspected
          # and its 2-case QA artifact is confirmed present and unexpired.
          # Avoid workflow-file identifier lookup ambiguity after squash merge.
          id="41639114775"
          sha="5a3b7a35c8840f4172d47081b6f17f2018a2f33b"
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.conclusion')"
          echo "G57 verified tested source run=$id conclusion=$conclusion"
          test "$conclusion" = "success"
          test "$actual_sha" = "$sha"
          file="tools/geo_rail_g57_new_BR3_BR4_G56_real_original_DGT2m.py"
          source_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$sha" --jq '.sha')"
          merged_blob="$(git hash-object "$file")"
          echo "G57 validated source blob: GH=$source_blob main=$merged_blob"
          test "$source_blob" = "$merged_blob"
          mkdir -p "$RUNNER_TEMP/G57pub"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G57-original-DGT2m-recovered-BR3-BR4 \
            --dir "$RUNNER_TEMP/G57pub"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G57pub"
          d=json.loads((p/"G57-two-recovered-G56-BR3-BR4-original-DGT2m-ground-and-grade.json").read_text())
          assert d["full30_G10_G30_original_still_retained"]
          assert len(d["two_G56_200kmh_horizontal_research_actual_ground_profiles"])==2
          assert d["no_missing_source_pixel_imputation"] and d["no_original_DGT_acquisition_or_new_TIFFs_downloaded_from_DGT"]
          assert d["no_guaranteed_200kmh_operating_speed_by_curvature_sample"] and not d["Fxx_accepted"]
          PY
      - name: Publish native measured 2m ground along new recovered BR3 BR4 research curves, no fake civil engineering
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G57pub"
          gh release create "mn-geo-rail-001-g57-BR3-BR4-new-curves-DGT-ground-$GITHUB_RUN_ID" \
            "$d/G57-two-recovered-G56-BR3-BR4-original-DGT2m-ground-and-grade.json" \
            "$d/G57-BR3-BR4-new-curvature-actual-DGT2m-25m-ground-samples.csv" \
            "$d/G57-recovered-BR3-BR4-real-ground-and-12p5-15-grade.png" \
            "$d/G57-recovered-Braganca-geometric-candidates-actual-DGT-ground-technical-review.md" \
            "$d/G57-native-original-DGT-source-reused-SHA.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G57 new original DGT2m source ground on recovered BR3 BR4 G30 geographical diversity 200km/h curvature study geometres" \
            --notes "Follows G56 recovered BR3 BR4 200kmh sampled horizontal radius routes, resamples original native DGT2m ground source on NEW geometry not old G54 missing G30 diversity. Each 121×25m points, source original DGT TIFF previously published only; actual native masked NoData not interpolated. Source complete only permits optimistic research grade 12.5/15‰, PAT10 800m and 20km hypothetical vertical curve; no guarantee 200kmh operating speed, no EN curve/clothoid/cant, cannot imply full intercity 3D, station environmental/road access, geology, Natura/PIC, tunnels/viaducts/CAPEX/travel-time. BR3 heading rotated; previous OSRM ground physical study site time cannot certify changed access. No new DGT or Fxx/Site."

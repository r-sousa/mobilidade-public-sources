name: MN-GEO-RAIL-001 G27D original DGT GML nested geometry source reader diagnostic
on:
  push:
    branches:
      - mn-geo-rail-001-g27-official-restrictions-source-gates-20261101
    paths:
      - tools/geo_rail_g27d_GML_source_parser_diagnostic.py
      - .github/workflows/mn-geo-g27d-original-SNIT-GML-diagnostic.yml
permissions:
  contents: read
jobs:
  primary_SNIT_three_original_GML_sample_schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GDAL Pyogrio original GML driver
        run: python -m pip install --disable-pip-version-check 'pyogrio>=0.10,<1'
      - name: Show bounded official source GML XML topology and GDAL parsing error, never full geometry or secrets
        run: python tools/geo_rail_g27d_GML_source_parser_diagnostic.py

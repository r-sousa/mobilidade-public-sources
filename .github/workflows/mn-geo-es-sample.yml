name: MN-GEO-RAIL-001 W3 sample Zamora

on:
  push:
    branches:
      - mn-geo-rail-001-es-wcs-20261030
    paths:
      - .github/workflows/mn-geo-es-sample.yml
      - tools/geo_rail_es_wcs_sample.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-geo-rail-001-es-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wcs-one-km-sample:
    if: github.ref == 'refs/heads/mn-geo-rail-001-es-wcs-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial validator
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2'
      - name: Request at most one square kilometre of CNIG WCS data
        id: sample
        shell: bash
        run: |
          if python tools/geo_rail_es_wcs_sample.py \
             --output=reports/mn-geo-rail-001/es-wcs-25m-zamora-sample.json; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve metadata only; never native raster bytes
        shell: bash
        run: |
          set -euo pipefail
          receipt=reports/mn-geo-rail-001/es-wcs-25m-zamora-sample.json
          cp "$receipt" "$RUNNER_TEMP/es-wcs-sample.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$receipt")"
            cp "$RUNNER_TEMP/es-wcs-sample.json" "$receipt"
            git add "$receipt"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data(geo): record bounded CNIG WCS 25m near-Zamora pilot"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
      - name: Require validated native sample, not merely successful HTTP
        env:
          FAILED: ${{ steps.sample.outputs.failed }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "No validated WCS sample; preserve error receipt for diagnostic" >&2
            exit 1
          fi

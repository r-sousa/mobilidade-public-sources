name: NORTE 2040 — new Iberian GIS acquisition
on:
  push:
    branches: [main]
    paths: ['extraction_requests/MN-TDR214-NEW-GIS-ACQUIRE.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mn-tdr214-new-gis-acquire
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry tooling
        run: python3 -m pip install osmium==4.3.0 shapely==2.1.2 pyproj==3.7.2
      - name: Acquire missing Iberian geodata into private sink
        run: python3 src/mn_public_acquisition/tdr214_cartography_acquire.py

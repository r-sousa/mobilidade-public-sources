name: MN-GEO-RAIL-001 G26A DGT COS2025 original OGC bounded source availability probe
on:
  push:
    branches:
      - mn-geo-rail-001-g26-cos2025-proximity-and-dgt-gap-gates-20261101
    paths:
      - tools/geo_rail_g26a_cos2025_original_source_probe.py
      - .github/workflows/mn-geo-g26a-COS2025-source-probe.yml
permissions:
  contents: read
jobs:
  no_COS_vector_data_if_DGT_OGC_provider_500:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official producer collection and tiny GeoJSON OGC 1-feature bboxes, save status only
        run: |
          python tools/geo_rail_g26a_cos2025_original_source_probe.py --json "$RUNNER_TEMP/G26A-original-COS2025-provider-access-status.json"
      - uses: actions/upload-artifact@v4
        with:
          name: G26A-DGT-COS2025-official-original-source-health
          path: ${{ runner.temp }}/G26A-original-COS2025-provider-access-status.json
          retention-days: 30
          if-no-files-found: error

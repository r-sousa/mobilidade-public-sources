name: MN-GEO-RAIL-001 G14 original INE BGRI2021 station geographic population envelopes
on:
  push:
    branches:
      - mn-geo-rail-001-g14-bgri21-demographic-catchments-20261031
      - main
    paths:
      - tools/geo_rail_g14_bgri2021_station_population.py
      - tests/test_geo_rail_g14_bgri2021_catchments.py
      - .github/workflows/mn-geo-g14-original-bgri21-population.yml
permissions:
  contents: write
jobs:
  source_original_G14_official_population_service_envelopes:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific source spatial libraries
        run: python -m pip install --disable-pip-version-check 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Test GPKG geometry binary integrity and census privacy/no-imputation guard
        run: |
          python -m py_compile tools/geo_rail_g14_bgri2021_station_population.py
          python -m unittest discover -s tests -p 'test_geo_rail_g14_bgri2021_catchments.py' -v
      - name: Retrieve preserved immutable official INE F67 BGRI2021 246MB and G13A original urban-reference evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G14-sources"
          gh release download mn-f67-bgri21-cont-original-INE-verified-20261031 \
            --repo r-sousa/mobilidade-public-sources \
            --pattern 'BGRI21_CONT.zip' \
            --dir "$RUNNER_TEMP/G14-sources"
          gh release download mn-geo-rail-001-g13a-local-surface-access-41248977225 \
            --repo r-sousa/mobilidade-public-sources \
            --pattern 'G13A-108-station-research-site-surface-graded-access.json' \
            --dir "$RUNNER_TEMP/G14-sources"
          echo "3eb49fb9e262e9d6ccb4b493811b7e21e2bbb31b0afe1431851ddd459ad7f171  $RUNNER_TEMP/G14-sources/BGRI21_CONT.zip" | sha256sum -c -
          echo "063c1ddae2eb8020edc530bfef09fe8239208068b918a56d6054005ad31bfaee  $RUNNER_TEMP/G14-sources/G13A-108-station-research-site-surface-graded-access.json" | sha256sum -c -
      - name: Count official 2021 residents for geographic 5 10 20km study areas and six-city nonoverlapping corridor unions
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g14_bgri2021_station_population.py \
            --zip "$RUNNER_TEMP/G14-sources/BGRI21_CONT.zip" \
            --g13a "$RUNNER_TEMP/G14-sources/G13A-108-station-research-site-surface-graded-access.json" \
            --json "$RUNNER_TEMP/G14-BGRI2021-three-families-six-cities-5-10-20km-catchments.json" \
            --csv "$RUNNER_TEMP/G14-BGRI2021-city-study-catchments.csv" \
            --markdown "$RUNNER_TEMP/G14-population-service-evidence.md"
          python - <<'PY'
          import pathlib,os,json
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          p=base/"G14-BGRI2021-three-families-six-cities-5-10-20km-catchments.json"
          r=json.loads(p.read_text())
          assert len(r["all_54_city_research_geographic_buffer_census_cases"])==54
          assert len(r["six_family_population_nonoverlapping_buffer_union_cases"])==6
          assert r["source_schema_validation"]["record_count"]==203264
          assert r["source_schema_validation"]["srs"]==3763
          assert r["mandatory_service_markets"]==["Vila Real","Bragança"]
          assert r["Sanabria_excluded"] and r["geographic_buffers_are_not_road_public_transport_isochrones"]
          assert r["no_actual_daily_rail_demand_or_modal_choice"]
          assert r["no_new_original_INE_download_this_run"]
          assert not r["Fxx_accepted"] and not r["Site_authorized"]
          assert (base/"G14-BGRI2021-city-study-catchments.csv").stat().st_size>200
          print("G14 native 203264 subsection census source, exact SHA, 54 demography circles, 6 overlap-free geography unions, no fictional OD/access")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G14-original-INE-census-geographic-station-population
          path: |
            ${{ runner.temp }}/G14-BGRI2021-three-families-six-cities-5-10-20km-catchments.json
            ${{ runner.temp }}/G14-BGRI2021-city-study-catchments.csv
            ${{ runner.temp }}/G14-population-service-evidence.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish derived no-overlap demographic evidence on main only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g14-bgri2021-station-demographic-envelopes-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/G14-BGRI2021-three-families-six-cities-5-10-20km-catchments.json" "$RUNNER_TEMP/G14-BGRI2021-city-study-catchments.csv" "$RUNNER_TEMP/G14-population-service-evidence.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MN-GEO-RAIL-001 G14 2021 resident population geographic service envelopes: 3 corridor families × 6 city study stations" \
            --notes "Statistics Portugal original F67 SHA pinned BGRI21_CONT.zip, 203264 georeferenced subsections, true INE N_INDIVIDUOS age-group census fields EPSG3763. Exact centroid/representative-point and area-fraction sensitivity within 5/10/20 km of actual G13A research point references, plus 10/20 km unions counting intersecting population only once. These Euclidean circles are NOT access-time isochrones, G13A source points are NOT approved railway stations, and residential population is NOT train ridership, 2026 population or employment. No original F67 data re-download, Fxx canonical change, Site, rail cost or constructed geometry claim."

name: Refresh preserved-state acknowledgement

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: mn-preserved-state-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh metadata-only preserved-state index
        run: python -m mn_public_acquisition.sync_preserved_state

      - name: Persist index if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- preserved_state/index.json; then
            echo "No preserved-state changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preserved_state/index.json
          git commit -m 'state(mn): refresh preserved-state acknowledgement'
          git push origin HEAD:main

name: G63 private release binary materialisation

on:
  push:
    branches: [main]
    paths:
      - 'extraction_requests/G63-private-release-binary-materialisation.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mn-g63-private-release-binary-materialisation
  cancel-in-progress: false

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_REPO: r-sousa/EU-transp-weekly
      PRIVATE_BRANCH: mobilidade-norte-recovery-20260919
      SPEC_PATH: extraction_requests/G63-private-release-binary-materialisation.json
      PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic PDF extraction runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -1
          pdfinfo -v 2>&1 | head -1

      - name: Validate exact bounded spec
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('extraction_requests/G63-private-release-binary-materialisation.json')
          spec=json.loads(p.read_text(encoding='utf-8'))
          assert spec['schema_version']=='1.0.0'
          assert spec['mission_generation']==63
          assert spec['task_id']=='G63-PRIVATE-RELEASE-BINARY-MATERIALISATION'
          assert spec['private_repository']=='r-sousa/EU-transp-weekly'
          assert spec['private_branch']=='mobilidade-norte-recovery-20260919'
          expected={
            'F197':{585058768},
            'F199':{585209109,585209143,585209235,585209279,585209322,585209365,585209430,585209183},
            'F201':{585209108,585209137,585209170,585209232,585209276,585209313,585209353,585209406},
            'F203':{585059962},
          }
          got={k:{int(x['asset_id']) for x in v} for k,v in spec['families'].items()}
          assert got==expected, (got, expected)
          flat=[int(x['asset_id']) for members in spec['families'].values() for x in members]
          assert len(flat)==18 and len(set(flat))==18
          for family,members in spec['families'].items():
            for row in members:
              assert row['bytes']>0
              assert re.fullmatch(r'[0-9a-f]{64}',row['sha256'])
              assert row['role'] in {'analytical_member','updated_analytical_member','superseded_lineage_only','historical_member'}
              assert row.get('producer_reacquisition') is False
          assert spec['policy']['producer_reacquisition'] is False
          assert spec['policy']['canonical_admission'] is False
          assert spec['policy']['rights_change'] is False
          print('SPEC_VALIDATION_PASS:18_EXACT_PINNED_ASSETS')
          PY

      - name: Materialise exact private release bytes and extract page-native text/locators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g63-private"
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.error, urllib.request
          from datetime import datetime, timezone

          spec=json.loads(pathlib.Path(os.environ['SPEC_PATH']).read_text(encoding='utf-8'))
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g63-private'
          token=(os.environ.get('PRIVATE_READ_TOKEN') or os.environ.get('PRIVATE_SINK_TOKEN') or '').strip()
          if not token:
              raise SystemExit('PRIVATE_RELEASE_READ_CREDENTIAL_MISSING')

          def get_asset(asset_id):
              url=f"https://api.github.com/repos/{os.environ['PRIVATE_REPO']}/releases/assets/{asset_id}"
              headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/octet-stream',
                  'User-Agent':'MobilidadeNorte-G63PrivateMaterialiser/1.0',
                  'X-GitHub-Api-Version':'2022-11-28'
              }
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=240) as r:
                      return r.read()
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode('utf-8','replace')
                  raise RuntimeError(f'PRIVATE_RELEASE_ASSET_READ_FAILED:{asset_id}:HTTP_{exc.code}:{detail[:300]}')

          def pdf_info(path):
              cp=subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True,check=True)
              meta={}
              for line in cp.stdout.splitlines():
                  if ':' in line:
                      k,v=line.split(':',1); meta[k.strip()]=v.strip()
              return meta

          def page_records(text, base):
              pages=text.split('\f')
              if pages and pages[-1]=='': pages=pages[:-1]
              out=[]
              for i,page in enumerate(pages,1):
                  lines=page.splitlines()
                  cand=[]; start=None; prev=None
                  for idx,line in enumerate(lines,1):
                      numeric=len(re.findall(r'(?<!\w)[+-]?(?:\d+[\d .,/]*\d|\d)(?!\w)',line))
                      aligned=bool(re.search(r'\S\s{2,}\S',line))
                      hit=numeric>=2 and aligned
                      if hit and start is None: start=idx
                      if not hit and start is not None:
                          if idx-start>=2:
                              cand.append({'page':i,'start_line':start,'end_line':idx-1,'locator_type':'LAYOUT_TABLE_CANDIDATE','semantic_interpretation':False})
                          start=None
                  if start is not None and len(lines)+1-start>=2:
                      cand.append({'page':i,'start_line':start,'end_line':len(lines),'locator_type':'LAYOUT_TABLE_CANDIDATE','semantic_interpretation':False})
                  rec=dict(base)
                  rec.update({
                      'page':i,
                      'line_count':len(lines),
                      'text_sha256':hashlib.sha256(page.encode('utf-8')).hexdigest(),
                      'lines':lines,
                      'table_candidate_locators':cand
                  })
                  out.append(rec)
              return out

          inventory=[]
          family_rows={k:[] for k in spec['families']}
          failures=[]
          tool_versions={}
          for cmd in (['pdftotext','-v'],['pdfinfo','-v']):
              cp=subprocess.run(cmd,capture_output=True,text=True)
              tool_versions[cmd[0]]=(cp.stderr or cp.stdout).splitlines()[0] if (cp.stderr or cp.stdout) else 'UNKNOWN'

          for family,members in spec['families'].items():
              for m in members:
                  aid=int(m['asset_id'])
                  data=get_asset(aid)
                  sha=hashlib.sha256(data).hexdigest()
                  if len(data)!=int(m['bytes']) or sha!=m['sha256']:
                      raise SystemExit(f'PINNED_BYTE_VERIFICATION_FAILED:{aid}:bytes={len(data)}:sha256={sha}')
                  pdf=root/f'{aid}.pdf'; pdf.write_bytes(data)
                  info=pdf_info(pdf)
                  txt=root/f'{aid}.txt'
                  subprocess.run(['pdftotext','-layout','-enc','UTF-8',str(pdf),str(txt)],check=True)
                  text=txt.read_text(encoding='utf-8',errors='replace')
                  base={
                      'source_set_id':family,
                      'asset_id':aid,
                      'asset_name':m['asset_name'],
                      'role':m['role'],
                      'source_year':m.get('source_year'),
                      'publication_year':m.get('publication_year'),
                      'revision':m.get('revision'),
                      'release_id':m['release_id'],
                      'release_tag':m['release_tag'],
                      'verified_bytes':len(data),
                      'verified_sha256':sha,
                      'native_semantics_preserved':True
                  }
                  records=page_records(text,base)
                  family_rows[family].extend(records)
                  inv=dict(base)
                  inv.update({
                      'byte_verification':'PASS',
                      'pdf_pages_reported':int(info.get('Pages','0') or 0),
                      'text_pages_extracted':len(records),
                      'text_bytes':len(text.encode('utf-8')),
                      'text_sha256':hashlib.sha256(text.encode('utf-8')).hexdigest(),
                      'pdf_metadata':info,
                      'text_layer_state':'TEXT_PRESENT' if text.strip() else 'NO_TEXT_LAYER',
                      'table_locator_semantics':'LAYOUT_CANDIDATES_ONLY_NOT_OBSERVATIONS'
                  })
                  inventory.append(inv)
                  pdf.unlink(missing_ok=True); txt.unlink(missing_ok=True)

          for family,rows in family_rows.items():
              out=root/f'{family}-pages.jsonl'
              with out.open('w',encoding='utf-8') as f:
                  for row in rows:
                      f.write(json.dumps(row,ensure_ascii=False,sort_keys=True)+'\n')

          extraction={
              'schema_version':'5.8.0',
              'mission_generation':63,
              'worker':'W2C',
              'task_id':'G63-PRIVATE-RELEASE-BINARY-MATERIALISATION',
              'status':'PASS_EXACT_PRIVATE_RELEASE_BYTES_VERIFIED_AND_PAGE_NATIVE_DESCENDANTS_EMITTED',
              'producer_reacquisition':False,
              'canonical_admission':False,
              'rights_change':False,
              'source_families':['F197','F199','F201','F203'],
              'asset_count':len(inventory),
              'asset_inventory':inventory,
              'tool_versions':tool_versions,
              'semantic_guards':{
                  'page_text_is_source_native_extraction_not_normalized_observation':True,
                  'layout_table_candidates_are_locators_not_semantic_tables':True,
                  'publication_year_not_inferred_from_pdf_creation_metadata':True,
                  'f199_superseded_2024_lineage_only_preserved':True,
                  'f201_funding_not_performance':True,
                  'f203_operator_kpis_not_whole_authority_kpis':True
              },
              'completed_at_utc':datetime.now(timezone.utc).isoformat()
          }
          (root/'asset-inventory.json').write_text(json.dumps({'assets':inventory},ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/'extraction-receipt.json').write_text(json.dumps(extraction,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'status':extraction['status'],'asset_count':len(inventory),'families':{k:len(v) for k,v in family_rows.items()}},sort_keys=True))
          PY

      - name: Persist private descendants and W3B handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          spec=json.loads(pathlib.Path(os.environ['SPEC_PATH']).read_text(encoding='utf-8'))
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g63-private'
          token=(os.environ.get('PRIVATE_SINK_TOKEN') or '').strip()
          if not token:
              raise SystemExit('PRIVATE_SINK_WRITE_CREDENTIAL_MISSING')
          repo=os.environ['PRIVATE_REPO']; branch=os.environ['PRIVATE_BRANCH']
          base=spec['private_output_base']

          def api(method,url,body=None):
              headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'MobilidadeNorte-G63PrivateMaterialiser/1.0','X-GitHub-Api-Version':'2022-11-28'}
              data=None
              if body is not None:
                  data=json.dumps(body).encode('utf-8'); headers['Content-Type']='application/json'
              req=urllib.request.Request(url,headers=headers,data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=240) as r:
                      raw=r.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode('utf-8','replace')
                  raise RuntimeError(f'GITHUB_API_{method}_FAILED:{exc.code}:{detail[:500]}')

          def get(path):
              u=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path,safe="/")}?ref={urllib.parse.quote(branch)}'
              try: return api('GET',u)
              except RuntimeError as exc:
                  if ':404:' in str(exc): return None
                  raise

          def put(path,data,message):
              old=get(path)
              body={'message':message,'branch':branch,'content':base64.b64encode(data).decode('ascii')}
              if old and old.get('sha'): body['sha']=old['sha']
              u=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path,safe="/")}'
              return api('PUT',u,body)

          emitted=[]
          for name in ['asset-inventory.json','F197-pages.jsonl','F199-pages.jsonl','F201-pages.jsonl','F203-pages.jsonl','extraction-receipt.json']:
              data=(root/name).read_bytes()
              path=f'{base}/{name}'
              res=put(path,data,f'result(mn): G63 private materialisation {name}')
              emitted.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob_sha':res['content']['sha']})

          receipt=json.loads((root/'extraction-receipt.json').read_text(encoding='utf-8'))
          handoff={
              'schema_version':'5.8.0',
              'mission_generation':63,
              'worker':'W2C',
              'task_id':'G63-PRIVATE-RELEASE-BINARY-MATERIALISATION',
              'status':'PASS_READY_W3B_RESUME',
              'source_families':['F197','F199','F201','F203'],
              'asset_count':18,
              'producer_reacquisition':False,
              'canonical_admission':False,
              'rights_change':False,
              'data_bearing_descendants':emitted,
              'w3b_instruction':'Resume G63-TA-REGISTERED-DATA once using these exact page-native descendants. Preserve W3B v5 source-year/revision/lineage guards; F199 asset 585209183 remains lineage-only. Do not re-fetch producer bytes and do not infer publication year from PDF creation metadata.',
              'w1b_instruction':'Treat this as technical byte-materialisation/extraction evidence only; semantic normalization/admission remains W3B then W1B.',
              'extraction_status':receipt['status'],
              'completed_at_utc':datetime.now(timezone.utc).isoformat()
          }
          hb=(json.dumps(handoff,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode('utf-8')
          hp=f'{base}/handoff.json'
          res=put(hp,hb,'handoff(mn): G63 private release binary materialisation')
          print(json.dumps({'handoff_path':hp,'handoff_blob':res['content']['sha'],'emitted_count':len(emitted)},sort_keys=True))
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '# G63 private release binary materialisation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact pinned private assets only; no producer reacquisition.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Descendants are written only to the private Mobilidade Norte repository.' >> "$GITHUB_STEP_SUMMARY"

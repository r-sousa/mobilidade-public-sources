name: MN-GEO-RAIL-001 G28 primary Natura2000 and PIC strict preselection
on:
  push:
    branches:
      - mn-geo-rail-001-g28-natura-pic-preselection-20261101
      - main
    paths:
      - tools/geo_rail_g28_natura_pic_constraint_gate.py
      - tests/test_geo_rail_g28_natura_pic_gate.py
      - .github/workflows/mn-geo-g28-natura-pic-preselection.yml
permissions:
  contents: read
jobs:
  environmental-source-scan:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g28-natura-pic-preselection-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded spatial analysis dependencies
        run: python -m pip install --disable-pip-version-check 'shapely>=2,<3' 'pyproj>=3.6,<4' 'requests>=2.31,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1'
      - name: Test strict UNKNOWN and environmental conflict gates
        run: |
          python -m py_compile tools/geo_rail_g28_natura_pic_constraint_gate.py
          python -m unittest discover -s tests -p 'test_geo_rail_g28_natura_pic_gate.py' -v
      - name: Retrieve original published 27 G10 real study lines (NOT tracks)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G28"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' \
            --dir "$RUNNER_TEMP/G28"
          python - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G28/G10-27-research-real-source-paths.geojson"
          a=json.loads(p.read_text())
          assert len(a["features"])==27 and len({f["properties"]["id"] for f in a["features"]})==27
          assert all(f["properties"]["this_is_not_an_approved_or_proposed_railway_alignment"] for f in a["features"])
          print("G10 SOURCE SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Bounded original ICNF and MITECO Natura2000 geometry requests and independent geospatial overlays
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g28_natura_pic_constraint_gate.py \
            --g10 "$RUNNER_TEMP/G28/G10-27-research-real-source-paths.geojson" \
            --out "$RUNNER_TEMP/G28/G28-27-corridor-7-city-Natura-PIC-original-source-screen.json" \
            --md "$RUNNER_TEMP/G28/G28-environmental-preselection-Natura-PIC.md" \
            --polygons "$RUNNER_TEMP/G28/G28-original-ICNF-MITECO-natura-clipped-geometry.geojson"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G28/G28-27-corridor-7-city-Natura-PIC-original-source-screen.json"
          q=json.loads(p.read_text())
          assert len(q["corridor_grid_research_27"])==27 and len(q["city_research_circles_7"])==7
          assert q["PIC"].startswith("UNKNOWN") and not q["legal_or_environmental_authorization"]
          assert q["no_DGT_download"] and q["no_Fxx_or_Site"] and q["Sanabria_excluded"]
          g=pathlib.Path(os.environ["RUNNER_TEMP"])/"G28/G28-original-ICNF-MITECO-natura-clipped-geometry.geojson"
          ge=json.loads(g.read_text())
          assert ge["type"]=="FeatureCollection" and len(ge["features"])==q["producer_clipped_natura_polygon_count"]
          import hashlib
          assert hashlib.sha256(g.read_bytes()).hexdigest()==q["producer_clipped_natura_polygon_cache_sha256"]
          print("G28 PRODUCER STATES",{k:v["status"] for k,v in q["source_receipts"].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G28-primary-Natura2000-PIC-27-alternatives-7-areas
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G28/G28-27-corridor-7-city-Natura-PIC-original-source-screen.json
            ${{ runner.temp }}/G28/G28-environmental-preselection-Natura-PIC.md
            ${{ runner.temp }}/G28/G28-original-ICNF-MITECO-natura-clipped-geometry.geojson

  independent-main-verified-source-publisher:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover latest successful branch primary artifacts, requiring matching exact acquisition source script blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_branch="mn-geo-rail-001-g28-natura-pic-preselection-20261101"
          wf="mn-geo-g28-natura-pic-preselection.yml"
          runid="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=$source_branch&status=success&per_page=6" --jq '.workflow_runs[0].id')"
          test -n "$runid" && test "$runid" != "null"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$runid" --jq '.head_sha')"
          f="tools/geo_rail_g28_natura_pic_constraint_gate.py"
          src_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$source_sha" --jq '.sha')"
          local_blob="$(git hash-object "$f")"
          test "$src_blob" = "$local_blob" || { echo "G28 primary acquisition source script drift"; exit 21; }
          mkdir -p "$RUNNER_TEMP/G28-main"
          gh run download "$runid" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G28-primary-Natura2000-PIC-27-alternatives-7-areas \
            --dir "$RUNNER_TEMP/G28-main"
          python - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G28-main"
          j=json.loads((p/"G28-27-corridor-7-city-Natura-PIC-original-source-screen.json").read_text())
          t=p/"G28-original-ICNF-MITECO-natura-clipped-geometry.geojson"
          c=json.loads(t.read_text())
          assert len(j["corridor_grid_research_27"])==27 and len(j["city_research_circles_7"])==7
          assert j["source_receipts"]["PT_ICNF"]["status"]=="VERIFIED"
          assert j["source_receipts"]["ES_MITECO"]["status"]=="VERIFIED"
          assert len(c["features"])==j["producer_clipped_natura_polygon_count"]>0
          assert hashlib.sha256(t.read_bytes()).hexdigest()==j["producer_clipped_natura_polygon_cache_sha256"]
          assert j["PIC"].startswith("UNKNOWN") and not j["legal_or_environmental_authorization"]
          assert j["Sanabria_excluded"] and j["Vila_Real_Braganca_mandatory"]
          print("G28 publish only authenticated producer geometries and 27/7 safety gate, no recurring producer downloads")
          PY
      - name: Create protected-main prerelease for later source-reuse without MITECO 118MB national re-download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G28-main"
          tag="mn-geo-rail-001-g28-natura-PT-ES-PIC-source-preacceptance-$GITHUB_RUN_ID"
          gh release create "$tag" \
            "$d/G28-27-corridor-7-city-Natura-PIC-original-source-screen.json" \
            "$d/G28-original-ICNF-MITECO-natura-clipped-geometry.geojson" \
            "$d/G28-environmental-preselection-Natura-PIC.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G28 ICNF/MITECO original Natura2000 cross-border 27 research corridors, PIC UNKNOWN, NOT engineering/legally cleared" \
            --notes "Two original independent primary producer sources (ICNF source response, MITECO official national shp clipped inside protected ephemeral runner), verified source SHA and source-script Git blob, 27 original G10 research-grid lines and 7 urban 400m circles. Positive overlap indicates strong environmental avoidance priority. All geographical study-lines are NOT actual railway tracks. PIC acronym/boundary unknown, legal assessments pending; no new DGT2m, Fxx or Site. Clipped nature polygons archived for reuse without repeated 118MB Spain original download."

name: Recover preserved public data from private repository

on:
  workflow_dispatch:
    inputs:
      source_set_id:
        description: 'Optional Fxx to recover; blank processes all configured rights-cleared bootstrap sources'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'recovery_specs/recovery-request.yml'

permissions:
  contents: write

concurrency:
  group: mn-private-preserved-public-bootstrap
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      GITHUB_TOKEN: ${{ github.token }}
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
      REQUESTED_SOURCE_SET: ${{ inputs.source_set_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify temporary private read bridge
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MN_PRIVATE_READ_TOKEN:-}" && -z "${MN_PRIVATE_SINK_TOKEN:-}" ]]; then
            echo "MN_PRIVATE_READ_OR_SINK_TOKEN_MISSING" >&2
            exit 1
          fi

      - name: Recover preserved public source packages
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED_SOURCE_SET:-}"
          mode=""
          config="recovery_specs/private-public-bootstrap.yml"
          if [[ -f recovery_specs/recovery-request.yml ]]; then
            readarray -t request_fields < <(python - <<'PY'
          import yaml
          p=yaml.safe_load(open("recovery_specs/recovery-request.yml",encoding="utf-8")) or {}
          print(str(p.get("source_set_id") or "").strip())
          print(str(p.get("mode") or "").strip())
          print(str(p.get("config") or "").strip())
          PY
            )
            if [[ -z "$requested" ]]; then requested="${request_fields[0]:-}"; fi
            mode="${request_fields[1]:-}"
            if [[ -n "${request_fields[2]:-}" ]]; then config="${request_fields[2]}"; fi
          fi

          mkdir -p "$RUNNER_TEMP/mn-recovery"
          echo "Recovery request: ${requested:-ALL}; mode=${mode:-bootstrap}; config=$config"

          if [[ "$mode" == "w4c_shared_energy" ]]; then
            [[ "$config" == "recovery_specs/w4c-shared-energy.yml" ]]
            python -m mn_public_acquisition.run_w4c_shared \
              "$config" \
              --out "$RUNNER_TEMP/mn-recovery/result.json"
          else
            args=(
              "$config"
              --out "$RUNNER_TEMP/mn-recovery/result.json"
            )
            if [[ -n "$requested" && "$requested" != "ALL" ]]; then
              [[ "$requested" =~ ^F[0-9]{2,4}$ ]]
              args+=(--source-set "$requested")
            fi
            python -m mn_public_acquisition.private_bootstrap "${args[@]}"
          fi

      - name: Persist public recovery run receipt
        if: always()
        env:
          RUN_RECEIPT: ${{ runner.temp }}/mn-recovery/result.json
        run: |
          python - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          from pathlib import Path

          path=Path(os.environ["RUN_RECEIPT"])
          if not path.is_file():
              raise SystemExit(0)

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          run=os.environ["GITHUB_RUN_ID"]
          dest=f"recovery_receipts/bootstrap/run-{run}.json"
          api=f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(dest,safe='/')}"
          headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/vnd.github+json",
              "User-Agent":"MobilidadeNorte-RecoveryReceipt/1.0",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json",
          }
          body={
              "message":f"receipt(mn): preserved private bootstrap run {run}",
              "branch":"main",
              "content":base64.b64encode(path.read_bytes()).decode("ascii"),
          }
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers=headers,method="PUT")
          with urllib.request.urlopen(req,timeout=120) as r:
              print(json.load(r)["commit"]["sha"])
          PY

      - name: Recovery summary
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"mn-recovery/result.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Private-preserved execution\n\n")
              if not p.exists():
                  f.write("- No recovery result was produced. Check the private read secret preflight.\n")
              else:
                  obj=json.loads(p.read_text())
                  for row in obj.get("results",[]):
                      f.write(f"- {row.get('source_set_id')}: {row.get('status')}\n")
                  if obj.get("failures"):
                      f.write("\n## Failures\n")
                      for x in obj["failures"]:
                          f.write(f"- {x['source_set_id']}: {x['error']}\n")
          PY

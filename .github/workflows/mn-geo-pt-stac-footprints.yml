name: MN-GEO-RAIL-001 PT DGT six-sector MDT footprints

on:
  push:
    branches:
      - mn-geo-rail-001-pt-public-stac-20261030
    paths:
      - .github/workflows/mn-geo-pt-stac-footprints.yml
      - tools/geo_rail_pt_stac_footprints.py
      - tests/test_geo_rail_pt_stac_footprints.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-geo-rail-001-pt-stac-footprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-public-discovery:
    if: github.ref == 'refs/heads/mn-geo-rail-001-pt-public-stac-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source/sanitization/limits tests, no network
        run: python -m unittest discover -s tests -p 'test_geo_rail_pt_stac_footprints.py' -v
      - name: Discover 6 public MDT footprint windows, 2 collections per window
        id: probe
        shell: bash
        run: |
          if python tools/geo_rail_pt_stac_footprints.py \
            --output=reports/mn-geo-rail-001/pt-dgt-mdt-sector-footprints.json; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist sanitized metadata (no source assets)
        shell: bash
        run: |
          set -euo pipefail
          receipt=reports/mn-geo-rail-001/pt-dgt-mdt-sector-footprints.json
          cp "$receipt" "$RUNNER_TEMP/mn-geo-pt-footprints.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$receipt")"
            cp "$RUNNER_TEMP/mn-geo-pt-footprints.json" "$receipt"
            git add "$receipt"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data(geo): add anonymous DGT MDT candidate coverage footprints"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
      - name: Signal incomplete metadata evidence
        env:
          FAILED: ${{ steps.probe.outputs.failed }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more public DGT STAC windows unverified; review persisted receipt" >&2
            exit 1
          fi

name: MN-GEO-RAIL-001 DGT protected 12-tile Mirandela grid native QA

# Trusted manual dispatch only. No push, PR, schedule or unreviewed ref
# may access protected DGT Environment credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mn-geo-rail-001-protected-dgt-grid12
  cancel-in-progress: false

jobs:
  verify-protected-main:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce GitHub main branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          protected="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/r-sousa/mobilidade-public-sources/branches/main" | jq -r '.protected')"
          [[ "$protected" == 'true' ]] || { echo "::error::Refusing to run on unprotected main"; exit 1; }

  twelve-reviewed-native-source-tiles:
    needs: verify-protected-main
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: dgt-cdd
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only reviewed raster and HTTP dependencies
        run: python -m pip install --disable-pip-version-check 'rasterio>=1.4,<2' 'requests>=2.32,<3'
      - name: Verify all twelve source-indexed tiles and 17 seams offline without credentials
        run: python -m unittest discover -s tests -p 'test_geo_rail_pt_cdd_grid12.py' -v
      - name: Authenticate safely and audit 12 native DGT source tiles in temporary runner
        env:
          DGT_CDD_USERNAME: ${{ secrets.DGT_CDD_USERNAME }}
          DGT_CDD_PASSWORD: ${{ secrets.DGT_CDD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tools/geo_rail_pt_cdd_grid12.py \
            --index reports/mn-geo-rail-001/pt-dgt-mdt-candidate-envelopes.geojson \
            --receipt "$RUNNER_TEMP/dgt-grid12-sanitized-qa.json"
      - name: Store sanitized SHA hashes, native CRS/pixel/seam QA, not native data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mn-geo-rail-001-dgt-grid12-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/dgt-grid12-sanitized-qa.json
          if-no-files-found: warn
          retention-days: 15
      - name: Explain status boundaries
        if: always()
        shell: bash
        run: |
          echo "DGT private credential contents and signed raster URLs were not logged or uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "Native rasters are runner-only; this is 12 km² local Mirandela QA, not a Porto-Zamora alignment or cross-border vertical harmonization." >> "$GITHUB_STEP_SUMMARY"

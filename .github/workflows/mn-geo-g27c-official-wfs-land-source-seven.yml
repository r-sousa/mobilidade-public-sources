name: MN-GEO-RAIL-001 G27C DGT SNIT REN/RAN/CRUS 7 original land source WFS intersections
on:
  push:
    branches:
      - mn-geo-rail-001-g27-official-restrictions-source-gates-20261101
      - main
    paths:
      - tools/geo_rail_g27c_original_SNIT_REN_RAN_CRUS_seven_WFS_intersections.py
      - tests/test_geo_rail_g27c_real_snitsource.py
      - .github/workflows/mn-geo-g27c-official-wfs-land-source-seven.yml
permissions:
  contents: write
jobs:
  G27C_7_site_original_DGT_SNIT_3_topics_source_limited:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g27-official-restrictions-source-gates-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyogrio/PROJ/GML limited source readers; no private access
        run: python -m pip install --disable-pip-version-check 'pyogrio>=0.10,<1' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Strict source query size and legal unknown behavior tests
        run: |
          python -m py_compile tools/geo_rail_g27c_original_SNIT_REN_RAN_CRUS_seven_WFS_intersections.py
          python -m unittest discover -s tests -p test_geo_rail_g27c_real_snitsource.py -v
      - name: Ground 7 exact COS2025 locations in official original G26C source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G27C"
          gh release download mn-geo-rail-001-g26c-COS2025-original-seven-site-landuse-41260758585 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G26C-source-original-COS2025-seven-study-sites-QA.json' --dir "$RUNNER_TEMP/G27C"
          echo "caf506f6bd114fe200f3f95d29951e97b8c1d9e18c8c654fa64c4ae3f75e81e4  $RUNNER_TEMP/G27C/G26C-source-original-COS2025-seven-study-sites-QA.json" | sha256sum -c -
      - name: 21 bounded original SNIT source GML polygon bbox requests, preserve null unknown not false legal absence
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g27c_original_SNIT_REN_RAN_CRUS_seven_WFS_intersections.py \
            --g26c "$RUNNER_TEMP/G27C/G26C-source-original-COS2025-seven-study-sites-QA.json" \
            --work "$RUNNER_TEMP/G27C/temp-original-GML-not-published" \
            --json "$RUNNER_TEMP/G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json" \
            --geojson "$RUNNER_TEMP/G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson" \
            --markdown "$RUNNER_TEMP/G27C-seven-source-legal-pending-matrix.md"
          python - <<'PY'
          import pathlib,os,json
          d=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((d/"G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json").read_text())
          g=json.loads((d/"G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson").read_text())
          assert j["source_research_sites"]==7 and j["source_service_bounded_request_count"]==21
          assert len(j["seven_research_site_by_service_source_status"])==7
          assert len(g["features"])==j["primary_original_source_clipped_vector_geometry_count"]
          assert j["all_PDM_REN_official_DR_legal_map_validation_pending"] and j["REN_source_Exclusoes_must_not_be_counted_as_legal_REN"]
          assert not j["Fxx_accepted"] and not j["Site_authorized"]
          assert (d/"G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson").stat().st_size<15000000
          print("G27C exact 7×3 DGT SNIT vector bbox source diagnostic; no legal permission or invented missing constraint")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G27C-original-SNIT-source-seven-areas-prelegal
          path: |
            ${{ runner.temp }}/G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json
            ${{ runner.temp }}/G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson
            ${{ runner.temp }}/G27C-seven-source-legal-pending-matrix.md
          retention-days: 30
          if-no-files-found: error
  independent_main_publisher_reuses_verified_branch_wfs_artifact:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact last successful original DGT WFS source-scan artifact; NEVER repeat 21 requests on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="mn-geo-rail-001-g27-official-restrictions-source-gates-20261101"
          workflow="mn-geo-g27c-official-wfs-land-source-seven.yml"
          runid="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$branch&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$runid" && test "$runid" != "null"
          branchsha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$runid" --jq '.head_sha')"
          scriptpath="tools/geo_rail_g27c_original_SNIT_REN_RAN_CRUS_seven_WFS_intersections.py"
          source_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$scriptpath?ref=$branchsha" --jq '.sha')"
          local_blob="$(git hash-object "$scriptpath")"
          test "$source_blob" = "$local_blob" || { echo "Source acquisition script drift: original branch and main must use same verified code"; exit 15; }
          mkdir -p "$RUNNER_TEMP/G27C-publication"
          gh run download "$runid" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G27C-original-SNIT-source-seven-areas-prelegal \
            --dir "$RUNNER_TEMP/G27C-publication"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G27C-publication"
          q=json.loads((p/"G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json").read_text())
          g=json.loads((p/"G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson").read_text())
          assert q["source_research_sites"]==7
          assert q["source_service_bounded_request_count"]==21
          assert len(q["seven_research_site_by_service_source_status"])==7
          assert len(g["features"])==q["primary_original_source_clipped_vector_geometry_count"]
          assert q["all_PDM_REN_official_DR_legal_map_validation_pending"]
          assert q["REN_source_Exclusoes_must_not_be_counted_as_legal_REN"]
          assert not q["Fxx_accepted"] and not q["Site_authorized"]
          print("G27C original WFS site evidence independently QA verified, no repeat producer 21-call acquisition")
          PY
      - name: Publish observed official source WFS clipped evidence with mandatory legal caveat on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g27c-DGT-SNIT-original-REN-RAN-CRUS-seven-$(echo "$GITHUB_RUN_ID")"
          d="$RUNNER_TEMP/G27C-publication"
          gh release create "$tag" \
            "$d/G27C-seven-SNIT-REN-RAN-CRUS-original-source-area-assessment.json" \
            "$d/G27C-seven-SNIT-REN-RAN-CRUS-clipped-observed-geometries.geojson" \
            "$d/G27C-seven-source-legal-pending-matrix.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G27C official original DGT SNIT 7-site bounded REN RAN CRUS WFS observed source polygons, NOT legally cleared" \
            --notes "Reuse only audited 21 bounded SNIT WFS branch source queries, with original source Git blob identity verified; no repeat queries. Unavailable, capped, unparseable or no features UNKNOWN legally; REN EXCLUSOES not necessarily REN encumbrance, official DR map/PDM legally prevail. Seven original COS2025 research areas, no station selection, new DGT elevation or Fxx/Site."

name: Mobilidade Norte – TdR 2.1.4 residual acquisition
on:
  push:
    branches: [main]
    paths: ['extraction_requests/MN-TDR214-PHASE2-20261122.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mn-tdr214-phase2
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      MN_PRIVATE_READ_TOKEN: ${{ secrets.MN_PRIVATE_READ_TOKEN }}
      MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Acquire residual original datasets and save private evidence
        run: python3 src/mn_public_acquisition/recover_tdr214_phase2.py

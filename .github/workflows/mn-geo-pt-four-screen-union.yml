name: MN-GEO-RAIL-001 W2 four-screen source reconciliation
on:
  push:
    branches:
      - mn-geo-rail-001-east-braganca-stac-20261031
    paths:
      - tools/geo_rail_pt_four_screen_union.py
      - tests/test_geo_rail_pt_four_screen_union.py
      - .github/workflows/mn-geo-pt-four-screen-union.yml
permissions:
  contents: write
concurrency:
  group: mn-geo-rail-001-g09-four-source-reconcile
  cancel-in-progress: false
jobs:
  full-receipt-QA:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-east-braganca-stac-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four-source source-file QA and regression tests (no network, no secrets)
        run: python -m unittest discover -s tests -p 'test_geo_rail_pt_four_screen_union.py' -v
      - name: Recalculate exact source SHA and ID union; report 2m/50cm bbox exceptions
        run: |
          python tools/geo_rail_pt_four_screen_union.py --report-dir reports/mn-geo-rail-001 --output "$RUNNER_TEMP/four-screen-qa.json"
      - name: Commit deterministic sanitized 4-screen evidence to isolated branch
        run: |
          set -euo pipefail
          target=reports/mn-geo-rail-001/pt-dgt-four-screen-catalogue-union-qa.json
          cp "$RUNNER_TEMP/four-screen-qa.json" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          if ! git diff --cached --quiet; then
             git commit -m "data(geo): source-hashed G09 union and 54 bbox exceptions"
             git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve preacceptance boundaries
        run: |
          echo "G09 is metadata only; 54 discrepant 2m/50cm bbox pairs are retained, NOT coerced." >> "$GITHUB_STEP_SUMMARY"
          echo "No new original MDT pixels, geodetic acceptance, Fxx or Site." >> "$GITHUB_STEP_SUMMARY"

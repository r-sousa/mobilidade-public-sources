name: F67 INE BGRI 2021 authentic public-source archive and release
on:
  push:
    branches:
      - mn-f67-bgri21-original-public-release-20261031
      - main
    paths:
      - tools/f67_ine_bgri2021_public_original.py
      - .github/workflows/mn-f67-bgri21-original-public-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  F67_official_archive_redistribution_only_after_exact_original_validation:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code syntax and historic source original fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/f67_ine_bgri2021_public_original.py
          grep -F '3eb49fb9e262e9d6ccb4b493811b7e21e2bbb31b0afe1431851ddd459ad7f171' source_specs/F67.yml
          grep -F '246754080' source_specs/F67.yml
          grep -F 'private_only' source_specs/F67.yml
      - name: Protected branch first probes producer exact original and connectivity (no large download before QA merge)
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,json
          url="https://mapas.ine.pt/download/filesGPG/2021/BGRI21_CONT.zip"
          req=urllib.request.Request(url,headers={
            "Range":"bytes=0-2047",
            "User-Agent":"MobilidadeNorte-F67-official-source-preflight/1.0",
            "Accept":"application/zip,application/octet-stream,*/*"})
          with urllib.request.urlopen(req,timeout=65) as resp:
            head=resp.read(16)
            detail={"http_status":resp.status,"final_domain":resp.url.split("/")[2],
             "response_type":resp.headers.get("Content-Type"),
             "length":resp.headers.get("Content-Length"),
             "content_range":resp.headers.get("Content-Range"),
             "magic_zip":head.startswith(b"PK\\x03\\x04")}
            print("F67_OFFICIAL_ORIGINAL_PREFLIGHT="+json.dumps(detail))
            assert detail["final_domain"]=="mapas.ine.pt"
            assert head[:2]==b"PK"
          PY
      - name: Download and authenticate official original INE 2021 BGRI, inspect GPKG fields / metadata
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/F67-original"
          python tools/f67_ine_bgri2021_public_original.py \
            --zip "$RUNNER_TEMP/F67-original/BGRI21_CONT.zip" \
            --receipt "$RUNNER_TEMP/F67-original/F67-original-INE-QA-and-licensing.json" \
            --markdown "$RUNNER_TEMP/F67-original/F67-original-source-provenance-README.md"
          echo "3eb49fb9e262e9d6ccb4b493811b7e21e2bbb31b0afe1431851ddd459ad7f171  $RUNNER_TEMP/F67-original/BGRI21_CONT.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/F67-original/BGRI21_CONT.zip")" -eq 246754080
      - name: Upload immutable original and QA as a NON canonical public GitHub release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mn-f67-bgri21-cont-original-INE-verified-20261031"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Original public release already exists; do not mutate original release automatically"
            exit 0
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/F67-original/BGRI21_CONT.zip" \
            "$RUNNER_TEMP/F67-original/F67-original-INE-QA-and-licensing.json" \
            "$RUNNER_TEMP/F67-original/F67-original-source-provenance-README.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "F67 INE BGRI 2021 Continental original producer ZIP — exact SHA256 verified" \
            --notes "User-requested distinct immutable public source copy of original Instituto Nacional de Estatística Censos 2021 BGRI21_CONT.zip, SHA256 3eb49fb9e262e9d6ccb4b493811b7e21e2bbb31b0afe1431851ddd459ad7f171, 246754080 bytes. Source https://mapas.ine.pt/download/filesGPG/2021/BGRI21_CONT.zip and producer metadata https://mapas.ine.pt/download/metadados/bgri.html indicating public access and use without conditions. Exact ZIP CRC and GPKG SQLite validation required. Not a third-party mirror or replacement F67 private canonical original. This release contains statistical geographic subsections, NOT origin-destination commuting, recent employment nor railway station ridership. Cite INE, Censos 2021 and the metadata page."

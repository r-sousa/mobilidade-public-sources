name: MN-GEO-RAIL-001 G26C source COS2025 full original ZIP one-time branch clip only
on:
  push:
    branches:
      - mn-geo-rail-001-g26-cos2025-proximity-and-dgt-gap-gates-20261101
      - main
    paths:
      - tools/geo_rail_g26c_original_DGT_COS2025_archived_clip.py
      - tests/test_geo_rail_g26c_original_cos2025_archive.py
      - .github/workflows/mn-geo-g26c-COS2025-official-zip-clipped.yml
permissions:
  contents: read
jobs:
  one_off_source_acquisition_and_tiny_7_area_clip:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g26-cos2025-proximity-and-dgt-gap-gates-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install indexed spatial GeoPackage original DGT vector dependencies
        run: python -m pip install --disable-pip-version-check 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'pyproj>=3.6,<4' 'shapely>=2.1,<3'
      - name: Test source schema and published original DGT 876MB ZIP size
        run: |
          python -m py_compile tools/geo_rail_g26c_original_DGT_COS2025_archived_clip.py
          python -m unittest discover -s tests -p test_geo_rail_g26c_original_cos2025_archive.py -v
      - name: Reuse exact G25 seven real mandatory-city study references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G26C"
          gh release download mn-geo-rail-001-g25-original-road-shortlist-G24-41259277284 --repo "$GITHUB_REPOSITORY" --pattern 'G25-OSRM-real-road-access-to-original-ground-site-shortlist.json' --dir "$RUNNER_TEMP/G26C"
          echo "be35181c882c2f6ede4d07f7e0a68b084bb6247c54a7da0d1d566a66f844dffd  $RUNNER_TEMP/G26C/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" | sha256sum -c -
      - name: Exactly once download 876MB official DGT COS2025v1-S2 national GPKG ZIP into disposable runner, NEVER publish or upload national file
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --retry-delay 8 --max-time 1200 "https://geo2.dgterritorio.gov.pt/cos/S2/COS2025/COS2025v1-S2-gpkg.zip" --output "$RUNNER_TEMP/G26C/COS2025v1-S2-national-temp.zip"
          test "$(stat -c%s "$RUNNER_TEMP/G26C/COS2025v1-S2-national-temp.zip")" -eq 876190334
      - name: SHA and ZIP CRC audit official vector and extract only seven 400m station research land-use circles with spatial GPKG index
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g26c_original_DGT_COS2025_archived_clip.py \
            --zip "$RUNNER_TEMP/G26C/COS2025v1-S2-national-temp.zip" \
            --g25 "$RUNNER_TEMP/G26C/G25-OSRM-real-road-access-to-original-ground-site-shortlist.json" \
            --extract "$RUNNER_TEMP/G26C/UNPACK-NEVER-PUBLISH" \
            --json "$RUNNER_TEMP/G26C-source-original-COS2025-seven-study-sites-QA.json" \
            --geojson "$RUNNER_TEMP/G26C-original-COS2025-seven-clipped-study-circles.geojson" \
            --markdown "$RUNNER_TEMP/G26C-original-COS2025-seven-landuse-report.md"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          d=json.loads((p/"G26C-source-original-COS2025-seven-study-sites-QA.json").read_text())
          f=json.loads((p/"G26C-original-COS2025-seven-clipped-study-circles.geojson").read_text())
          assert d["seven_distinct_source_study_sites"]==7
          assert d["COS2025_source_archive_verified_hash_and_bytes"]["original_zip_bytes"]==876190334
          assert d["true_original_2025_COS_clipped_polygon_features"]==len(f["features"])>0
          assert not d["Fxx_accepted"] and not d["Site_authorized"]
          assert all(.92<=v["COS2025_original_covered_fraction"]<=1.08 for v in d["original_COS2025_local_7_site_summary"])
          assert (p/"G26C-original-COS2025-seven-clipped-study-circles.geojson").stat().st_size < 15000000
          print("Original COS2025 national ZIP source validated; output only original seven 400m site polygon clips")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G26C-original-DGT-COS2025-7-local-research-clips-not-national-file
          path: |
            ${{ runner.temp }}/G26C-source-original-COS2025-seven-study-sites-QA.json
            ${{ runner.temp }}/G26C-original-COS2025-seven-clipped-study-circles.geojson
            ${{ runner.temp }}/G26C-original-COS2025-seven-landuse-report.md
          retention-days: 30
          if-no-files-found: error
  main_publisher_only_reuse_successful_small_source_artifact:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse SHA-verified seven study clips from successful one-time branch G26C job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="repos/$GITHUB_REPOSITORY/actions/workflows/mn-geo-g26c-COS2025-official-zip-clipped.yml/runs?branch=mn-geo-rail-001-g26-cos2025-proximity-and-dgt-gap-gates-20261101&status=success&per_page=5"
          runid="$(gh api "$url" --jq '.workflow_runs[0].id')"
          test -n "$runid" && test "$runid" != "null"
          mkdir -p "$RUNNER_TEMP/G26C-publisher"
          gh run download "$runid" --repo "$GITHUB_REPOSITORY" --name G26C-original-DGT-COS2025-7-local-research-clips-not-national-file --dir "$RUNNER_TEMP/G26C-publisher"
          python - <<'PY'
          import json,pathlib,os,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G26C-publisher"
          x=json.loads((p/"G26C-source-original-COS2025-seven-study-sites-QA.json").read_text())
          f=json.loads((p/"G26C-original-COS2025-seven-clipped-study-circles.geojson").read_text())
          actual=hashlib.sha256(pathlib.Path("tools/geo_rail_g26c_original_DGT_COS2025_archived_clip.py").read_bytes()).hexdigest()
          assert x["COS_original_clipper_source_code_SHA256"]==actual
          assert x["seven_distinct_source_study_sites"]==7 and len(f["features"])==x["true_original_2025_COS_clipped_polygon_features"]>0
          assert x["COS2025_source_archive_verified_hash_and_bytes"]["original_zip_bytes"]==876190334
          assert not x["Fxx_accepted"] and not x["Site_authorized"]
          print("Independent G26C publisher verified exact original clipper code + original national ZIP SHA receipt. No second bulk download.")
          PY
      - name: Publish only small DGT COS2025 source clips and QA as CC-BY 4.0 source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g26c-COS2025-original-seven-site-landuse-${GITHUB_RUN_ID}"
          d="$RUNNER_TEMP/G26C-publisher"
          gh release create "$tag" "$d/G26C-source-original-COS2025-seven-study-sites-QA.json" "$d/G26C-original-COS2025-seven-clipped-study-circles.geojson" "$d/G26C-original-COS2025-seven-landuse-report.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G26C original DGT COS2025 landuse: 7 mandatory-city 400m station research circles" \
            --notes "DGT CC-BY 4.0. Original full-country 876MB COS2025v1-S2 GPKG was acquired ONLY once inside source branch disposable worker; original SHA, ZIP CRC and exact clipping script validated. Only 7 small research circles in Vila Real and Braganca preserved, not national original ZIP. Not legally approved sites, protected land/no-go zoning, expropriation rights, PDM, REN/RAN or railway design. No extra DGT 2m terrain raster acquisitions. No Fxx/Site."

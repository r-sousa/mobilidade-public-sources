name: MN-GEO-RAIL-001 G52 distinct five modules and six selected geographic station approach research families
on:
  push:
    branches:
      - mn-geo-rail-001-g52-distinct-modules-station-families-20261102
      - main
    paths:
      - tools/geo_rail_g52_six_source_modules_city_approach_families.py
      - tests/test_geo_rail_g52_module_family_reuse.py
      - .github/workflows/mn-geo-g52-distinct-module-station-families.yml
permissions:
  contents: read
jobs:
  source-G52-test-and-generate:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/mn-geo-rail-001-g52-distinct-modules-station-families-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GIS projection and original source geometry stack
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2.1,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.8,<4'
      - name: Verify source geo modules and station continuity caveats
        run: |
          python -m py_compile tools/geo_rail_g52_six_source_modules_city_approach_families.py
          python -m unittest discover -s tests -p 'test_geo_rail_g52_module_family_reuse.py' -v
      - name: Download only original G10 G30 and published G42 G45 G51 provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G52"
          gh release download mn-geo-rail-001-g10-27-geographic-visuals-41243658608 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G10-27-research-real-source-paths.geojson' --dir "$RUNNER_TEMP/G52"
          gh release download mn-geo-rail-001-g30-tunnel-aware-new-corridors-41278684148 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G30-three-new-Natura-aware-study-routes.geojson' --dir "$RUNNER_TEMP/G52"
          gh release download mn-geo-rail-001-g42-real-railgrade-limits-all30-41320331517 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json' --dir "$RUNNER_TEMP/G52"
          gh release download mn-geo-rail-001-g45-movable-city-railapproach-41332951589 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G45-30-all-630-original-station-2D-spline-approach-screen.json' --dir "$RUNNER_TEMP/G52"
          gh release download mn-geo-rail-001-g51-mixed-grade-all30-technical-priority-41432855999 \
            --repo "$GITHUB_REPOSITORY" --pattern 'G51-full30-60-source-only-mixed-gradient-rerank-priority.json' --dir "$RUNNER_TEMP/G52"
          echo "77d226cc842d33e2f799f2c269ddde57a17cb7d868791770c1624dda1b86136d  $RUNNER_TEMP/G52/G10-27-research-real-source-paths.geojson" | sha256sum -c -
      - name: Decompose 30 geographic lines into 5 actual modules and select 6 spatially diverse original-family samples plus 4 station sites
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/geo_rail_g52_six_source_modules_city_approach_families.py \
            --g10 "$RUNNER_TEMP/G52/G10-27-research-real-source-paths.geojson" \
            --g30 "$RUNNER_TEMP/G52/G30-three-new-Natura-aware-study-routes.geojson" \
            --g42 "$RUNNER_TEMP/G52/G42-source-30-five-sectors-and-real-MDT25-vertical-LP.json" \
            --g45 "$RUNNER_TEMP/G52/G45-30-all-630-original-station-2D-spline-approach-screen.json" \
            --g51 "$RUNNER_TEMP/G52/G51-full30-60-source-only-mixed-gradient-rerank-priority.json" \
            --json "$RUNNER_TEMP/G52/G52-all30-source-module-family-and-four-station-planar-options.json" \
            --csv "$RUNNER_TEMP/G52/G52-original-30-source-module-signatures-six-family-samples.csv" \
            --geojson "$RUNNER_TEMP/G52/G52-6-geographic-study-routes-and-existing-station-2D-options.geojson" \
            --figure "$RUNNER_TEMP/G52/G52-six-source-corridor-families-not-designed-railway-map.png" \
            --markdown "$RUNNER_TEMP/G52/G52-station-and-module-spatial-engineering-handover.md"
          python - <<'PY'
          import pathlib,os,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G52"
          d=json.loads((p/"G52-all30-source-module-family-and-four-station-planar-options.json").read_text())
          assert d["source_original_all30_preserved"] and d["source_27_G10_3_G30_count"]==30
          assert len(d["source_all30_module_and_four_station_planimetric_sensitivity"])==30
          assert len(d["G52_six_representative_original_source_routes_for_NEXT_ground_3D"])==6
          assert "G30-potential_deep_tunnel" in d["G52_six_representative_original_source_routes_for_NEXT_ground_3D"]
          assert set(d["source_module_diversity_preserved_by_six_samples_relative_to_nine"])=={
            "AFSC_to_Vila_Real_W","Vila_Real_E_to_Braganca_W","Braganca_E_to_Zamora"}
          assert d["original_G45_C2_station_planar_approaches_only_not_railway"]
          assert d["G42_local_two_city_research_grid_paths_each_shared_by_all30"]
          assert d["mandatory_cities"]==["Vila_Real","Braganca"] and d["Sanabria_not_station_or_required_node"]
          assert d["geology_hydro_Natura2000_PIC_NOT_CLEARED"]
          assert d["no_original_source_data_reacquired"] and not d["Fxx_accepted"] and not d["Site_authorized"]
          assert (p/"G52-six-source-corridor-families-not-designed-railway-map.png").stat().st_size>18000
          print("G52 verified original 30 source module variants, 6 representative for future original DGT/IGN 3D, mandatory VR/BR, no Sanabria")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G52-six-geographic-families-and-4station-handover
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/G52/G52-all30-source-module-family-and-four-station-planar-options.json
            ${{ runner.temp }}/G52/G52-original-30-source-module-signatures-six-family-samples.csv
            ${{ runner.temp }}/G52/G52-6-geographic-study-routes-and-existing-station-2D-options.geojson
            ${{ runner.temp }}/G52/G52-six-source-corridor-families-not-designed-railway-map.png
            ${{ runner.temp }}/G52/G52-station-and-module-spatial-engineering-handover.md
  publish-source-locked-G52:
    if: github.repository == 'r-sousa/mobilidade-public-sources' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm exact tested branch source blob matches merged producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          w="mn-geo-g52-distinct-module-station-families.yml"
          b="mn-geo-rail-001-g52-distinct-modules-station-families-20261102"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?branch=$b&status=success&per_page=5" --jq '.workflow_runs[0].id')"
          test -n "$id" && test "$id" != "null"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')"
          f="tools/geo_rail_g52_six_source_modules_city_approach_families.py"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$sha" --jq '.sha')" = "$(git hash-object "$f")"
          mkdir -p "$RUNNER_TEMP/G52pub"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G52-six-geographic-families-and-4station-handover \
            --dir "$RUNNER_TEMP/G52pub"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"G52pub"
          d=json.loads((p/"G52-all30-source-module-family-and-four-station-planar-options.json").read_text())
          assert d["source_original_all30_preserved"]
          assert len(d["G52_six_representative_original_source_routes_for_NEXT_ground_3D"])==6
          assert d["geology_hydro_Natura2000_PIC_NOT_CLEARED"] and not d["Fxx_accepted"]
          PY
      - name: Publish reusable full30 sector source geometry and six distinct family pilot map plus stations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/G52pub"
          gh release create "mn-geo-rail-001-g52-six-geographic-design-study-families-$GITHUB_RUN_ID" \
            "$d/G52-all30-source-module-family-and-four-station-planar-options.json" \
            "$d/G52-original-30-source-module-signatures-six-family-samples.csv" \
            "$d/G52-6-geographic-study-routes-and-existing-station-2D-options.geojson" \
            "$d/G52-six-source-corridor-families-not-designed-railway-map.png" \
            "$d/G52-station-and-module-spatial-engineering-handover.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G52 separate 6 geographical research sampling families from 30 pre-existing route alternatives before true 3D railway engineering" \
            --notes "Strict original-source 27 G10 +3 G30 lattice, five G42 module boundaries, official G51 8 mixed grade research priorities + G30 deep tunnel, and G45 630 exploratory 2D station contacts. Choose 6 merely to cover distinct geographic modules in next terrain/3D tests, no route excluded. Includes separate VR1/VR2 and BR3/BR4 source approach geometry, requires true continuous original DGT/IGN bare-earth for real 3D. No rail constructed design, cost, time, structures, Natura/PIC/environment or DGT source acquisition; no Fxx/Site."

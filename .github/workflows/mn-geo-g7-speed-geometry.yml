name: MN-GEO-RAIL-001 G7 160-200-250 conservative geometry and DSM screening
on:
  push:
    branches:
      - mn-geo-rail-001-g7-speed-geometry-terrain-20261031
      - main
    paths:
      - tools/geo_rail_g7_rail_screen.py
      - tests/test_geo_rail_g7_speed_screen.py
      - .github/workflows/mn-geo-g7-speed-geometry.yml
permissions:
  contents: write
jobs:
  G7-speed-terrain-research-screens:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit open GIS and science dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Test deterministic speed/radius, grade envelope, source lattice invariants
        run: |
          python -m py_compile tools/geo_rail_g7_rail_screen.py
          python -m unittest discover -s tests -p 'test_geo_rail_g7_speed_screen.py' -v
      - name: Reuse existing 85 MB verified Copernicus DEM DSM and published G6 research routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/G7-source"
          base="https://github.com/r-sousa/mobilidade-public-sources/releases/download"
          curl --fail --location --silent --show-error --retry 3 --max-time 200 "$base/mn-geo-rail-001-r1-airport-zamora-dsm-preacceptance-41198485197/MN-GEO-RAIL-001-AFSC-Zamora-GLO30-DSM-1arcsec.tif" -o "$RUNNER_TEMP/G7-source/GLO30-real-DSM.tif"
          echo "a708b502b2eb86236c70f2d74322e9d8e2ea1417eb24094d0e43536845407bd9  $RUNNER_TEMP/G7-source/GLO30-real-DSM.tif" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$base/mn-geo-rail-001-g6-three-complete-territorial-screens-41233103738/G6-3-complete-source-research-chains.json" -o "$RUNNER_TEMP/G7-source/G6-chains.json"
          echo "faa2f1d218c79a3647a0d32217ab7bd460cc8aed418750ac62b41844d2d5bc9d  $RUNNER_TEMP/G7-source/G6-chains.json" | sha256sum -c -
      - name: Test nine (three chain x three speed) curve radius proxies and longitudinal DSM pressure sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g7_rail_screen.py \
            --dsm "$RUNNER_TEMP/G7-source/GLO30-real-DSM.tif" \
            --g6 "$RUNNER_TEMP/G7-source/G6-chains.json" \
            --json "$RUNNER_TEMP/G7-160-200-250-curve-terrain-necessary-condition-screens.json" \
            --geojson "$RUNNER_TEMP/G7-160-200-250-geometric-screen-EPSG4326.geojson" \
            --markdown "$RUNNER_TEMP/G7-160-200-250-comparison.md"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"G7-160-200-250-curve-terrain-necessary-condition-screens.json").read_text())
          f=json.loads((root/"G7-160-200-250-geometric-screen-EPSG4326.geojson").read_text())
          assert len(r["scenarios"])==9
          assert sorted(set(x["speed_scenario_kmh"] for x in r["scenarios"]))==[160,200,250]
          assert r["mandatory_service_areas"]==["Vila Real","Bragança"] and r["Sanabria_excluded"]
          assert not r["Fxx_accepted"] and not r["Site_authorized"]
          assert r["source_GLO30_is_DSM_including_vegetation_buildings_not_bare_earth"]
          assert r["no_tunnel_viaduct_earthwork_cost_or_station_travel_time_estimates"]
          assert len(f["features"])==sum(x["candidate_within_3km_of_source_grid_found"] for x in r["scenarios"])
          print("G7 QA: source actual DSM + G6, 9 real raster screens, no false rail engineering claims")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G7-160-200-250-initial-convergence
          path: |
            ${{ runner.temp }}/G7-160-200-250-curve-terrain-necessary-condition-screens.json
            ${{ runner.temp }}/G7-160-200-250-geometric-screen-EPSG4326.geojson
            ${{ runner.temp }}/G7-160-200-250-comparison.md
          retention-days: 30
          if-no-files-found: error
      - name: Publish results as preacceptance from protected main only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g7-speed-radius-dsm-research-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/G7-160-200-250-curve-terrain-necessary-condition-screens.json" "$RUNNER_TEMP/G7-160-200-250-geometric-screen-EPSG4326.geojson" "$RUNNER_TEMP/G7-160-200-250-comparison.md" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MN-GEO-RAIL-001 G7 160/200/250 km/h conservative horizontal + surface vertical screens only" \
            --notes "Nine conservative necessary-condition source-backed spatial screens using real Copernicus GLO-30 DSM (SHA verified), reviewed G6 3 distinct study chains, 1668 mm example. Curvature thresholds 1500/2400/3700 m are research assumptions, not mandatory TSI design minima; gradient screens 18‰ mixed, 25‰ passenger, 35‰ sensitivity only. No continuous bare-earth DGT/IGN DTM; no real railway alignments, full line speed guarantee, transitions, stations, road access, exact tunnels/viaducts, vertical reference harmonization, approved costs or Fxx/Site. Non-passing screens are NOT proof of geographic infeasibility."

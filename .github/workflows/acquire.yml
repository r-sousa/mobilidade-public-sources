name: Mobilidade Norte public source acquisition

on:
  repository_dispatch:
    types: [mn-source-acquire]
  push:
    branches: [main]
    paths:
      - 'source_specs/**.yml'
      - 'source_specs/**.yaml'
      - 'requests/**.json'
  workflow_dispatch:
    inputs:
      source_set_id:
        description: 'Optional Fxx source-set id; blank runs all specs'
        required: false
        type: string
      request_id:
        description: 'Optional control-plane request id'
        required: false
        type: string
      primary_repair:
        description: 'Execute a primary-source repair after preserved-state review'
        required: false
        default: false
        type: boolean
      repair_authorization_path:
        description: 'Pinned private orchestrator authorization path'
        required: false
        type: string
      repair_authorization_ref:
        description: 'Pinned private orchestrator authorization commit'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mn-public-acquisition-${{ github.event.client_payload.source_set_id || inputs.source_set_id || github.sha }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate all source specifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from mn_public_acquisition.core import load_spec
          from mn_public_acquisition.spec_packages import materialize_to_dir

          specs = sorted(Path("source_specs").glob("*.y*ml"))
          if not specs:
              raise SystemExit("No source specifications found")
          for path in specs:
              spec = load_spec(path)
              print(f"VALID {path}: {spec['source_set_id']} {spec['adapter']} -> {spec['sink']}")

          package_root = Path("source_packages")
          validation_root = Path(os.environ["RUNNER_TEMP"]) / "package-validation"
          for package in sorted(package_root.glob("*.y*ml")) if package_root.is_dir() else []:
              manifest = materialize_to_dir(package, validation_root / package.stem)
              for member in manifest["members"]:
                  spec = load_spec(Path(member["spec_path"]))
                  print(
                      f"VALID_PACKAGE {package}: {member['request_identity']} "
                      f"{spec['source_set_id']} {spec['adapter']} -> {spec['sink']}"
                  )
          PY

      - name: Resolve source specifications
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SET_ID: ${{ github.event.client_payload.source_set_id }}
          DISPATCH_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DISPATCH_PRIMARY_REPAIR: ${{ github.event.client_payload.primary_repair }}
          DISPATCH_REPAIR_AUTH_PATH: ${{ github.event.client_payload.repair_authorization_path }}
          DISPATCH_REPAIR_AUTH_REF: ${{ github.event.client_payload.repair_authorization_ref }}
          MANUAL_SOURCE_SET_ID: ${{ inputs.source_set_id }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          MANUAL_PRIMARY_REPAIR: ${{ inputs.primary_repair }}
          MANUAL_REPAIR_AUTH_PATH: ${{ inputs.repair_authorization_path }}
          MANUAL_REPAIR_AUTH_REF: ${{ inputs.repair_authorization_ref }}
        run: |
          set -euo pipefail
          primary_repair=0
          repair_auth_path="-"
          repair_auth_ref="-"

          resolve_sid() {
            local sid="$1"
            local spec="source_specs/${sid}.yml"
            local package="source_packages/${sid}.yml"
            if [[ -f "$spec" && -f "$package" ]]; then
              echo "AMBIGUOUS_EXECUTION_PACKAGING: both $spec and $package exist" >&2
              return 1
            elif [[ -f "$spec" ]]; then
              printf '%s\n' "$spec"
            elif [[ -f "$package" ]]; then
              python -m mn_public_acquisition.spec_packages "$package" \
                --out-dir "$RUNNER_TEMP/package-specs/${sid}" \
                --manifest-out "$RUNNER_TEMP/package-${sid}.json" \
                --paths-only
            else
              echo "NO_EXECUTION_SPEC_OR_PACKAGE_FOR_${sid}" >&2
              return 1
            fi
          }

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            sid="${DISPATCH_SOURCE_SET_ID:-}"
            [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
            resolve_sid "$sid" > "$RUNNER_TEMP/specs.txt"
            rid="${DISPATCH_REQUEST_ID:-dispatch-${GITHUB_RUN_ID}}"
            if [[ "${DISPATCH_PRIMARY_REPAIR:-}" == "true" || "${DISPATCH_PRIMARY_REPAIR:-}" == "1" ]]; then
              primary_repair=1
              repair_auth_path="${DISPATCH_REPAIR_AUTH_PATH:--}"
              repair_auth_ref="${DISPATCH_REPAIR_AUTH_REF:--}"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${MANUAL_SOURCE_SET_ID:-}" ]]; then
            sid="$MANUAL_SOURCE_SET_ID"
            [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
            resolve_sid "$sid" > "$RUNNER_TEMP/specs.txt"
            rid="${MANUAL_REQUEST_ID:-manual-${GITHUB_RUN_ID}}"
            if [[ "${MANUAL_PRIMARY_REPAIR:-}" == "true" || "${MANUAL_PRIMARY_REPAIR:-}" == "1" ]]; then
              primary_repair=1
              repair_auth_path="${MANUAL_REPAIR_AUTH_PATH:--}"
              repair_auth_ref="${MANUAL_REPAIR_AUTH_REF:--}"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
            req=$(printf '%s\n' "$changed" | grep -E '^requests/.*\.json$' | head -n1 || true)
            if [[ -n "$req" ]]; then
              count=$(printf '%s\n' "$changed" | grep -Ec '^requests/.*\.json$' || true)
              [[ "$count" -eq 1 ]]
              read -r sid rid primary_repair repair_auth_path repair_auth_ref <<<"$(python - "$req" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          sid=str(r["source_set_id"])
          rid=str(r.get("request_id") or "")
          if not rid:
              raise SystemExit("request_id is required for push request")
          primary="1" if bool(r.get("primary_repair")) else "0"
          auth_path=str(r.get("repair_authorization_path") or "-")
          auth_ref=str(r.get("repair_authorization_ref") or "-")
          print(sid,rid,primary,auth_path,auth_ref)
          PY
              )"
              [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
              resolve_sid "$sid" > "$RUNNER_TEMP/specs.txt"
            else
              printf '%s\n' "$changed" \
                | grep -E '^source_specs/.*\.ya?ml$' \
                | sort -u > "$RUNNER_TEMP/specs.txt" || true
              rid="push-${GITHUB_RUN_ID}"
            fi
          else
            find source_specs -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              | sort > "$RUNNER_TEMP/specs.txt"
            rid="${MANUAL_REQUEST_ID:-manual-all-${GITHUB_RUN_ID}}"
          fi
          test -s "$RUNNER_TEMP/specs.txt"
          echo "request_id=$rid" >> "$GITHUB_OUTPUT"
          echo "primary_repair=$primary_repair" >> "$GITHUB_OUTPUT"
          echo "repair_auth_path=$repair_auth_path" >> "$GITHUB_OUTPUT"
          echo "repair_auth_ref=$repair_auth_ref" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/specs.txt"

      - name: Acquire, validate, hash and dispatch
        shell: bash
        env:
          MN_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
          MN_PRIVATE_REPO: r-sousa/EU-transp-weekly
          MN_PRIVATE_BRANCH: mobilidade-norte-recovery-20260919
          MN_PRIMARY_REPAIR: ${{ steps.request.outputs.primary_repair }}
          MN_REPAIR_AUTH_PATH: ${{ steps.request.outputs.repair_auth_path }}
          MN_REPAIR_AUTH_REF: ${{ steps.request.outputs.repair_auth_ref }}
        run: |
          set -euo pipefail
          overall=0
          mkdir -p "$RUNNER_TEMP/receipts"
          while IFS= read -r spec; do
            sid=$(python - "$spec" <<'PY'
          import sys, yaml
          s=yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          print(s["source_set_id"])
          PY
            )
            read -r sink preserved_skip member_request_identity <<<"$(python - "$spec" <<'PY'
          import sys, yaml
          s=yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          p=s.get("parameters") or {}
          print(
            s["sink"],
            "1" if p.get("preserved_first_skip_primary") else "0",
            str(p.get("execution_request_identity") or "-")
          )
          PY
            )"
            execution_request_id="$MN_REQUEST_ID"
            if [[ "$member_request_identity" != "-" ]]; then
              execution_request_id="${MN_REQUEST_ID}::${member_request_identity}"
            fi
            force_primary=0
            if [[ "${MN_PRIMARY_REPAIR:-0}" == "1" ]]; then
              if [[ "$sink" != "private" ]]; then
                echo "PRIMARY_REPAIR_REQUIRES_PRIVATE_SINK" >&2
                overall=1
                echo "::endgroup::"
                continue
              fi
              if python -m mn_public_acquisition.repair_authorization \
                "$sid" "$MN_REPAIR_AUTH_PATH" "$MN_REPAIR_AUTH_REF"; then
                force_primary=1
                echo "PRIMARY_REPAIR_AUTHORIZATION_PASS $sid"
              else
                echo "PRIMARY_REPAIR_AUTHORIZATION_FAIL $sid" >&2
                overall=1
                echo "::endgroup::"
                continue
              fi
            fi
            read -r gate_decision gate_state gate_action <<<"$(python - "$sid" "$force_primary" <<'PY'
          import sys
          from mn_public_acquisition.preserved_state import primary_decision
          sid=sys.argv[1]
          force=sys.argv[2]=="1"
          d=primary_decision(sid, force_primary=force)
          print(d["decision"], d["preservation_state"], d["default_action"])
          PY
            )"
            receipt="$RUNNER_TEMP/receipts/${sid}.json"
            echo "::group::${spec}"
            echo "EXECUTION_REQUEST ${execution_request_id}"
            echo "PRESERVED_STATE ${sid}: state=${gate_state} action=${gate_action} decision=${gate_decision}"
            if [[ "$preserved_skip" == "1" ]]; then
              echo "PRESERVED_FIRST_SKIP_PRIMARY $spec"
              echo "::endgroup::"
              continue
            elif [[ "$gate_decision" == "SKIP_PRIMARY_USE_PRESERVED_FIRST" ]]; then
              echo "PRESERVED_STATE_ACKNOWLEDGED_SKIP_PRIMARY $spec"
              echo "::endgroup::"
              continue
            elif [[ "$gate_decision" == "BLOCK_PRIMARY" ]]; then
              echo "PRESERVED_STATE_BLOCK_PRIMARY $spec"
              echo "::endgroup::"
              continue
            elif [[ "$sink" == "private" ]]; then
              if [[ -n "${MN_PRIVATE_SINK_TOKEN:-}" ]]; then
                if MN_REQUEST_ID="$execution_request_id" python -m mn_public_acquisition.core "$spec" --receipt-out "$receipt"; then
                  echo "ACQUIRE_PASS_PRIVATE_PUSH $spec"
                else
                  echo "ACQUIRE_FAIL_PRIVATE_PUSH $spec"
                  overall=1
                  echo "::endgroup::"
                  continue
                fi
              elif MN_REQUEST_ID="$execution_request_id" python -m mn_public_acquisition.core "$spec" --probe-only --receipt-out "$receipt"; then
                echo "ACQUIRE_PASS_PRIVATE_PULL_NO_SINK_TOKEN $spec"
              else
                echo "ACQUIRE_FAIL $spec"
                overall=1
                echo "::endgroup::"
                continue
              fi
            elif MN_REQUEST_ID="$execution_request_id" python -m mn_public_acquisition.core "$spec" --receipt-out "$receipt"; then
              echo "ACQUIRE_PASS_PUBLIC_RELEASE $spec"
            else
              echo "ACQUIRE_FAIL $spec"
              overall=1
              echo "::endgroup::"
              continue
            fi

            if python -m mn_public_acquisition.public_receipt "$receipt"; then
              echo "RECEIPT_PASS $spec"
            else
              echo "RECEIPT_FAIL $spec"
              overall=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/specs.txt"
          exit "$overall"

      - name: Security invariant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '(payload|token|cookie|source-cache)'; then
            echo "Unexpected persistent acquisition material in public checkout" >&2
            exit 1
          fi

name: Mobilidade Norte public source acquisition

on:
  repository_dispatch:
    types: [mn-source-acquire]
  push:
    branches: [main]
    paths:
      - 'source_specs/**.yml'
      - 'source_specs/**.yaml'
      - 'requests/**.json'
  workflow_dispatch:
    inputs:
      source_set_id:
        description: 'Optional Fxx source-set id; blank runs all specs'
        required: false
        type: string
      request_id:
        description: 'Optional control-plane request id'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mn-public-acquisition-${{ github.event.client_payload.source_set_id || inputs.source_set_id || github.sha }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate all source specifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mn_public_acquisition.core import load_spec
          specs = sorted(Path("source_specs").glob("*.y*ml"))
          if not specs:
              raise SystemExit("No source specifications found")
          for path in specs:
              spec = load_spec(path)
              print(f"VALID {path}: {spec['source_set_id']} {spec['adapter']} -> {spec['sink']}")
          PY

      - name: Resolve source specifications
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SET_ID: ${{ github.event.client_payload.source_set_id }}
          DISPATCH_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          MANUAL_SOURCE_SET_ID: ${{ inputs.source_set_id }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            sid="${DISPATCH_SOURCE_SET_ID:-}"
            [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
            spec="source_specs/${sid}.yml"
            test -f "$spec"
            printf '%s\n' "$spec" > "$RUNNER_TEMP/specs.txt"
            rid="${DISPATCH_REQUEST_ID:-dispatch-${GITHUB_RUN_ID}}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${MANUAL_SOURCE_SET_ID:-}" ]]; then
            sid="$MANUAL_SOURCE_SET_ID"
            [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
            spec="source_specs/${sid}.yml"
            test -f "$spec"
            printf '%s\n' "$spec" > "$RUNNER_TEMP/specs.txt"
            rid="${MANUAL_REQUEST_ID:-manual-${GITHUB_RUN_ID}}"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
            req=$(printf '%s\n' "$changed" | grep -E '^requests/.*\.json$' | head -n1 || true)
            if [[ -n "$req" ]]; then
              count=$(printf '%s\n' "$changed" | grep -Ec '^requests/.*\.json$' || true)
              [[ "$count" -eq 1 ]]
              read -r sid rid <<<"$(python - "$req" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          sid=str(r["source_set_id"])
          rid=str(r.get("request_id") or "")
          if not rid:
              raise SystemExit("request_id is required for push request")
          print(sid,rid)
          PY
              )"
              [[ "$sid" =~ ^F[0-9]{2,4}$ ]]
              spec="source_specs/${sid}.yml"
              test -f "$spec"
              printf '%s\n' "$spec" > "$RUNNER_TEMP/specs.txt"
            else
              printf '%s\n' "$changed" \
                | grep -E '^source_specs/.*\.ya?ml$' \
                | sort -u > "$RUNNER_TEMP/specs.txt" || true
              rid="push-${GITHUB_RUN_ID}"
            fi
          else
            find source_specs -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              | sort > "$RUNNER_TEMP/specs.txt"
            rid="${MANUAL_REQUEST_ID:-manual-all-${GITHUB_RUN_ID}}"
          fi
          test -s "$RUNNER_TEMP/specs.txt"
          echo "request_id=$rid" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/specs.txt"

      - name: Acquire, validate, hash and dispatch
        shell: bash
        env:
          MN_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MN_PRIVATE_SINK_TOKEN: ${{ secrets.MN_PRIVATE_SINK_TOKEN }}
          MN_PRIVATE_REPO: r-sousa/EU-transp-weekly
          MN_PRIVATE_BRANCH: mobilidade-norte-recovery-20260919
        run: |
          set -euo pipefail
          overall=0
          mkdir -p "$RUNNER_TEMP/receipts"
          while IFS= read -r spec; do
            sid=$(python - "$spec" <<'PY'
          import sys, yaml
          s=yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          print(s["source_set_id"])
          PY
            )
            read -r sink preserved_skip <<<"$(python - "$spec" <<'PY'
          import sys, yaml
          s=yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          print(s["sink"], "1" if (s.get("parameters") or {}).get("preserved_first_skip_primary") else "0")
          PY
            )"
            receipt="$RUNNER_TEMP/receipts/${sid}.json"
            echo "::group::${spec}"
            if [[ "$preserved_skip" == "1" ]]; then
              echo "PRESERVED_FIRST_SKIP_PRIMARY $spec"
              echo "::endgroup::"
              continue
            elif [[ "$sink" == "private" ]]; then
              if [[ -n "${MN_PRIVATE_SINK_TOKEN:-}" ]]; then
                if python -m mn_public_acquisition.core "$spec" --receipt-out "$receipt"; then
                  echo "ACQUIRE_PASS_PRIVATE_PUSH $spec"
                else
                  echo "ACQUIRE_FAIL_PRIVATE_PUSH $spec"
                  overall=1
                  echo "::endgroup::"
                  continue
                fi
              elif python -m mn_public_acquisition.core "$spec" --probe-only --receipt-out "$receipt"; then
                echo "ACQUIRE_PASS_PRIVATE_PULL_NO_SINK_TOKEN $spec"
              else
                echo "ACQUIRE_FAIL $spec"
                overall=1
                echo "::endgroup::"
                continue
              fi
            elif python -m mn_public_acquisition.core "$spec" --receipt-out "$receipt"; then
              echo "ACQUIRE_PASS_PUBLIC_RELEASE $spec"
            else
              echo "ACQUIRE_FAIL $spec"
              overall=1
              echo "::endgroup::"
              continue
            fi

            if python -m mn_public_acquisition.public_receipt "$receipt"; then
              echo "RECEIPT_PASS $spec"
            else
              echo "RECEIPT_FAIL $spec"
              overall=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/specs.txt"
          exit "$overall"

      - name: Security invariant
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '(payload|token|cookie|source-cache)'; then
            echo "Unexpected persistent acquisition material in public checkout" >&2
            exit 1
          fi

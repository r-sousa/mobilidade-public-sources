name: Temporary APA REA technology probe

on:
  push:
    branches: [apa-rea-tech-probe-20260922]
    paths:
      - 'scripts/probe_public_web.py'
      - '.github/workflows/apa-rea-tech-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe REA Parque rodoviario
        run: |
          python scripts/probe_public_web.py \
            'https://rea.apambiente.pt/content/parque-rodovi%C3%A1rio'
      - name: Inspect Easychart markup
        run: |
          python - <<'PY'
          import re, requests
          url='https://rea.apambiente.pt/content/parque-rodovi%C3%A1rio'
          text=requests.get(url,timeout=90).text
          for term in ('easychart','highcharts','setData','setConfig','dataUrl','easychart-chart-','chart_data'):
              print('===',term,'===')
              start=0
              shown=0
              while shown < 20:
                  i=text.lower().find(term.lower(),start)
                  if i < 0:
                      break
                  snippet=text[max(0,i-1000):min(len(text),i+5000)]
                  print(snippet.replace('\n',' '))
                  print()
                  shown += 1
                  start=i+len(term)
          PY

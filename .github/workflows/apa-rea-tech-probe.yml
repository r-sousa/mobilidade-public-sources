name: Temporary APA REA integration check

on:
  push:
    branches: [apa-rea-tech-probe-20260922]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schema/**'
      - '.github/workflows/apa-rea-tech-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run adapter mechanism tests
        run: python -m unittest tests.test_adapter_mechanisms -v
      - name: Verify live APA REA embedded charts
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from mn_public_acquisition.adapters import easychart_html

          spec = {
              "source_set_id": "F999",
              "source": {
                  "landing_url": "https://rea.apambiente.pt/content/parque-rodovi%C3%A1rio"
              },
              "parameters": {
                  "min_charts": 9,
                  "max_charts": 9,
                  "emit_csv": True,
              },
          }
          with tempfile.TemporaryDirectory() as td:
              work = Path(td)
              result = easychart_html(spec, work)
              payload = json.loads(
                  (work / "recomposed/easychart-charts.json").read_text(
                      encoding="utf-8"
                  )
              )
              if payload["chart_count"] != 9:
                  raise SystemExit(
                      f"expected 9 embedded charts, got {payload['chart_count']}"
                  )
              csv_count = sum(
                  1 for a in result["assets"]
                  if a.get("format") == "CSV"
              )
              print(
                  result["validation_result"],
                  "charts=", payload["chart_count"],
                  "csv=", csv_count,
              )
          PY

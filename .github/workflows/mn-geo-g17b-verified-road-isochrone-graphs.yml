name: MN-GEO-RAIL-001 G17B plot true motor-vehicle catchments and INE census service gains
on:
  push:
    branches:
      - mn-geo-rail-001-g15-road-isochrones-20261031
      - main
    paths:
      - tools/geo_rail_g17b_road_isochrone_visuals.py
      - .github/workflows/mn-geo-g17b-verified-road-isochrone-graphs.yml
permissions:
  contents: write
  actions: read
jobs:
  source_true_Valhalla_census_2021_plots:
    if: github.repository == 'r-sousa/mobilidade-public-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map chart dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'matplotlib>=3.8,<4' 'shapely>=2.1,<3' 'pyproj>=3.6,<4'
      - name: Wait for exact G17 original public census reverse-road computation before reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status="$(gh run view 41253141298 --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh run view 41253141298 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
              test "$conclusion" = success || { echo "G17_source_run_not_success: $conclusion"; exit 8; }
              break
            fi
            sleep 10
          done
          status="$(gh run view 41253141298 --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          test "$status" = completed || { echo "G17_source_run_timeout"; exit 9; }
          mkdir -p "$RUNNER_TEMP/G17B-source"
          gh run download 41253141298 --repo "$GITHUB_REPOSITORY" \
            --name MN-GEO-RAIL-001-G17-true-road-isochrones-original-INE2021 \
            --dir "$RUNNER_TEMP/G17B-source"
          test -s "$RUNNER_TEMP/G17B-source/G17-real-road-15-30-45min-INE2021-census.json"
          test -s "$RUNNER_TEMP/G17B-source/G17-reverse-15-30-45min-road-isochrone-geometry.geojson"
      - name: Plot real reverse 15/30/45 minute travel time unions and 2021 residents
        shell: bash
        run: |
          set -euo pipefail
          python tools/geo_rail_g17b_road_isochrone_visuals.py \
            --source "$RUNNER_TEMP/G17B-source/G17-real-road-15-30-45min-INE2021-census.json" \
            --geojson "$RUNNER_TEMP/G17B-source/G17-reverse-15-30-45min-road-isochrone-geometry.geojson" \
            --bars "$RUNNER_TEMP/G17B-population-2021-15-30-45min-road-travel-unions.png" \
            --heatmap "$RUNNER_TEMP/G17B-residents-2021-by-city-15min-OSM-isochrones.png" \
            --map "$RUNNER_TEMP/G17B-georeferenced-road-isochrones-three-families-15-30-45min.png"
          python - <<'PY'
          import pathlib,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("G17B-population-2021-15-30-45min-road-travel-unions.png",
            "G17B-residents-2021-by-city-15min-OSM-isochrones.png",
            "G17B-georeferenced-road-isochrones-three-families-15-30-45min.png"):
            assert (root/name).stat().st_size>10000
          print("G17B verified: 3 actual OSM roads maps and INE2021 population source charts")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MN-GEO-RAIL-001-G17B-actual-road-time-INE-census-population-charts
          path: |
            ${{ runner.temp }}/G17B-population-2021-15-30-45min-road-travel-unions.png
            ${{ runner.temp }}/G17B-residents-2021-by-city-15min-OSM-isochrones.png
            ${{ runner.temp }}/G17B-georeferenced-road-isochrones-three-families-15-30-45min.png
          retention-days: 30
          if-no-files-found: error
      - name: Publish 2021 source-backed true network accessibility visual evidence on main only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mn-geo-rail-001-g17b-real-road-15-30-45min-census-graphics-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$RUNNER_TEMP/G17B-population-2021-15-30-45min-road-travel-unions.png" \
            "$RUNNER_TEMP/G17B-residents-2021-by-city-15min-OSM-isochrones.png" \
            "$RUNNER_TEMP/G17B-georeferenced-road-isochrones-three-families-15-30-45min.png" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "G17B true auto-network OSM road 15/30/45min areas and real 2021 INE census residents: 3 corridor family maps" \
            --notes "Visuals from completed immutable G17 public Valhalla reverse-road origin-to-rail-research-point isochrone polygons and exact archived original INE Census BGRI21 for 2021. No bus/public transit access imputed, no viable rail stations, last-mile/legal access, live congestion, train ridership or CAPEX."
